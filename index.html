    <div>
      <Card>
        <CardHdr left="Nutrition — Today" right={<span style={{ fontSize: 11, color: "#aaa" }}>{calOverride ? "Override" : isTrainingDay ? "Training" : "Rest"} day</span>} />
        <div style={{ padding: 14 }}>
          <MacroBar label="Calories" value={totals.cal} goal={calGoal} color="#a5f3fc" />
          <MacroBar label="Protein" value={totals.protein} goal={config.nutrition.protein} color="#86efac" />
          <MacroBar label="Carbs" value={totals.carbs} goal={carbGoal} color="#fde68a" />
          <MacroBar label="Fat" value={totals.fat} goal={fatGoal} color="#fca5a5" />
          <div style={{ marginTop: 8, fontSize: 13, fontWeight: 500, color: remaining >= 0 ? "#166534" : "#dc2626" }}>{remaining >= 0 ? remaining + " kcal remaining" : Math.abs(remaining) + " kcal over goal"}</div>
          <div style={{ marginTop: 8, display: "flex", gap: 10 }}>
            {[["Meals", todayLogs.length], ["Home", homeCount], ["Eat-out", eatOutCount]].map(function(item) { return <div key={item[0]} style={{ flex: 1, background: "#f5f5f3", borderRadius: 8, padding: "5px 8px", textAlign: "center" }}><div style={{ fontSize: 15, fontWeight: 500 }}>{item[1]}</div><div style={{ fontSize: 10, color: "#aaa" }}>{item[0]}</div></div>; })}
          </div>
        </div>
      </Card>
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        {[["log","Log Food"],["meals","Meals"]].map(function(item) { return <button key={item[0]} onClick={function() { setNutTab(item[0]); }} style={{ flex: 1, padding: "8px 0", borderRadius: 10, border: "0.5px solid #ccc", cursor: "pointer", fontWeight: 500, fontSize: 13, background: nutTab === item[0] ? "#1a1a1a" : "#fff", color: nutTab === item[0] ? "#fff" : "#666" }}>{item[1]}</button>; })}
      </div>
      {nutTab === "log" && (
        <Card><div style={{ padding: 14 }}>
          <div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 4 }}>MEAL</div>
          <select value={meal} onChange={function(e) { setMeal(e.target.value); }} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "0.5px solid #ccc", margin: "4px 0 12px", fontSize: 14 }}>{MEALS.map(function(m) { return <option key={m}>{m}</option>; })}</select>
          <div style={{ display: "flex", gap: 8, marginBottom: 12, alignItems: "center" }}>
            <div style={{ fontSize: 13, fontWeight: 500, flex: 1 }}>Meal type</div>
            <div style={{ display: "flex", background: "#f0f0ee", borderRadius: 8, padding: 2 }}>
              {[["Home", false], ["Eat-out", true]].map(function(item) { return <button key={item[0]} onClick={function() { setIsEatOut(item[1]); if (!item[1]) setRestaurantType(""); }} style={{ padding: "6px 14px", borderRadius: 6, border: "none", background: isEatOut === item[1] ? "#1a1a1a" : "transparent", color: isEatOut === item[1] ? "#fff" : "#666", fontSize: 13, fontWeight: 500, cursor: "pointer" }}>{item[0]}</button>; })}
            </div>
          </div>
          {isEatOut && <div style={{ marginBottom: 12 }}><div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 4 }}>RESTAURANT TYPE (optional)</div><input value={restaurantType} onChange={function(e) { setRestaurantType(e.target.value); }} placeholder="e.g. Italian sit-down, sushi, fast food..." style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "0.5px solid #ccc", fontSize: 14, fontFamily: "inherit" }} /></div>}
          <div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 4 }}>DESCRIBE WHAT YOU ATE</div>
          <textarea value={description} onChange={function(e) { setDescription(e.target.value); }} placeholder="e.g. spaghetti al pomodoro con parmigiano..." rows={3} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "0.5px solid #ccc", margin: "4px 0 12px", fontSize: 14, resize: "vertical", fontFamily: "inherit" }} />
          {status && status.type === "loading" ? <ActionBtn onClick={function() { setStatus(null); }}>Cancel</ActionBtn> : <ActionBtn disabled={!description.trim()} onClick={async function() { setStatus({ type: "loading" }); try { setStatus({ type: "preview", data: await estimateFood(description, isEatOut, restaurantType) }); } catch(e) { setStatus({ type: "error", msg: e.message }); } }}>Estimate with AI</ActionBtn>}
          {status && status.type === "loading" && <div style={{ marginTop: 10, color: "#888", fontSize: 13, textAlign: "center" }}>Analysing...</div>}
          {status && status.type === "error" && <div style={{ marginTop: 10, color: "#dc2626", fontSize: 13 }}>Error: {status.msg}</div>}
          {status && status.type === "preview" && (
            <div style={{ marginTop: 14, background: "#f0fdf4", border: "0.5px solid #bbf7d0", borderRadius: 10, padding: 14 }}>
              <div style={{ fontWeight: 500, fontSize: 15, marginBottom: 4 }}>{status.data.name}</div>
              <div style={{ fontSize: 11, color: "#888", marginBottom: 8 }}>{isEatOut ? "Eat-out" : "Home"}{restaurantType ? " · " + restaurantType : ""}</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 6, marginBottom: 10 }}>
                {[["Kcal", status.data.cal],["Protein", status.data.protein],["Carbs", status.data.carbs],["Fat", status.data.fat]].map(function(item) { return <div key={item[0]} style={{ background: "#fff", borderRadius: 8, padding: "6px 4px", textAlign: "center" }}><div style={{ fontWeight: 700, fontSize: 15 }}>{item[1]}</div><div style={{ fontSize: 10, color: "#9ca3af" }}>{item[0]}</div></div>; })}
              </div>
             <div style={{ fontSize: 12, color: "#6b7280", marginBottom: 12, background: "#f9f9f7", borderRadius: 6, padding: "6px 8px", fontFamily: "monospace" }}>{status.data.reasoning}</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button onClick={function() { setStatus(null); }} style={{ flex: 1, padding: "8px 0", background: "#e5e7eb", color: "#374151", border: "none", borderRadius: 8, fontSize: 13, cursor: "pointer" }}>Cancel</button>
                <button onClick={function() { addEntry(status.data); setStatus(null); }} style={{ flex: 2, padding: "8px 0", background: "#2d7a4f", color: "#fff", border: "none", borderRadius: 8, fontWeight: 500, cursor: "pointer" }}>Add to log</button>
              </div>
            </div>
          )}
        </div></Card>
      )}
      {nutTab === "meals" && (
        <div>
          {!todayLogs.length && <div style={{ textAlign: "center", color: "#aaa", marginTop: 40, fontSize: 14 }}>Nothing logged today yet.</div>}
          {MEALS.map(function(m) {
            var entries = todayLogs.filter(function(e) { return e.meal_type === m; }); if (!entries.length) return null;
            return <div key={m} style={{ marginBottom: 14 }}><div style={{ fontWeight: 500, fontSize: 11, color: "#888", marginBottom: 6, textTransform: "uppercase", letterSpacing: 1 }}>{m}</div>{entries.map(function(e) { return <div key={e.id} style={{ background: "#fff", border: "0.5px solid #ddd", borderRadius: 10, marginBottom: 6 }}><div style={{ padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}><div><div style={{ fontWeight: 500, fontSize: 14 }}>{e.food}{e.is_eat_out ? <span style={{ fontSize: 10, background: "#fef9c3", color: "#854d0e", borderRadius: 4, padding: "1px 5px", marginLeft: 4 }}>eat-out</span> : <span style={{ fontSize: 10, background: "#dcfce7", color: "#166534", borderRadius: 4, padding: "1px 5px", marginLeft: 4 }}>home</span>}</div><div style={{ fontSize: 12, color: "#aaa" }}>P: {e.protein}g · C: {e.carbs}g · F: {e.fat}g{e.restaurant_type ? " · " + e.restaurant_type : ""}</div></div><div style={{ display: "flex", alignItems: "center", gap: 10 }}><span style={{ fontWeight: 500 }}>{e.cal || e.calories} kcal</span><button onClick={function() { onDeleteMeal(e.id); }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 16, color: "#dc2626" }}>×</button></div></div></div>; })}</div>;
          })}
          {todayLogs.length > 0 && <div style={{ background: "#f5f5f3", border: "0.5px solid #ddd", borderRadius: 10, padding: "10px 14px" }}><div style={{ fontWeight: 500, fontSize: 13 }}>Totals</div><div style={{ fontSize: 12, color: "#888", marginTop: 4 }}>{totals.cal} kcal · {totals.protein}g P · {totals.carbs}g C · {totals.fat}g F</div><div style={{ fontSize: 12, color: "#888", marginTop: 2 }}>{todayLogs.length} meals · {homeCount} home · {eatOutCount} eat-out</div></div>}
        </div>
      )}
    </div>
  );
}

// ── CALENDAR ──────────────────────────────────────────────────

function dayCellBg(iso, burnLogs, dailySummaryLogs, correction) {
  var burn = burnLogs[iso];
  if (!burn) return "#e8e8e6"; // grey — no burn data
  var summary = dailySummaryLogs[iso];
  if (!summary) return "#e8e8e6";
  var corrected = Math.round(burn * correction);
  var balance = (summary.calories || 0) - corrected;
  if (balance <= -300) return "#166534"; // dark green
  if (balance <= 0)    return "#bbf7d0"; // light green
  if (balance <= 300)  return "#fde68a"; // amber
  return "#fca5a5";                       // red
}

function DayDetail({ iso, burnLogs, onSaveBurn, weekSessions, activities, dailySummaryLogs, correction, config, omronLogs, onSaveOmron }) {
  var existing = burnLogs[iso] ? String(burnLogs[iso]) : "";
  var [burnInput, setBurnInput] = useState(existing);
  var [saved, setSaved] = useState(false);
  var existingOmron = omronLogs[iso] || null;
  var [weight, setWeight]           = useState(existingOmron ? String(existingOmron.bodyweight)    : "");
  var [bf, setBf]                   = useState(existingOmron ? String(existingOmron.body_fat)       : "");
  var [visceralFat, setVisceralFat] = useState(existingOmron && existingOmron.visceral_fat != null ? String(existingOmron.visceral_fat) : "");
  var [omronSaved, setOmronSaved]   = useState(false);
  useEffect(function() {
    setBurnInput(burnLogs[iso] ? String(burnLogs[iso]) : "");
    var o = omronLogs[iso] || null;
    setWeight(o ? String(o.bodyweight) : "");
    setBf(o ? String(o.body_fat) : "");
    setVisceralFat(o && o.visceral_fat != null ? String(o.visceral_fat) : "");
    setOmronSaved(false);
  }, [iso]);
  var burn = burnLogs[iso]; var correctedBurn = burn ? Math.round(burn * correction) : null;
  var session = weekSessions.find(function(s) { return s.date === iso; });
  var activity = activities.find(function(a) { return a.date === iso; });
  var summary = dailySummaryLogs[iso];
  function saveBurn() { var v = parseFloat(burnInput); if (!v || isNaN(v)) return; onSaveBurn(iso, v); setSaved(true); setTimeout(function() { setSaved(false); }, 2000); }
  function saveOmron() {
    var w = parseFloat(weight), b = parseFloat(bf), vf = visceralFat !== "" ? parseInt(visceralFat) : null;
    if (!w || !b || isNaN(w) || isNaN(b)) return;
    onSaveOmron(iso, w, b, vf);
    setOmronSaved(true);
    setTimeout(function() { setOmronSaved(false); }, 2000);
  }
  var leanMass = weight && bf ? Math.round(parseFloat(weight) * (1 - parseFloat(bf) / 100) * 10) / 10 : null;
  var fatMass  = weight && bf ? Math.round(parseFloat(weight) * (parseFloat(bf) / 100) * 10) / 10 : null;
  var label = new Date(iso + "T12:00:00").toLocaleDateString("en", { weekday: "long", month: "long", day: "numeric" });
  var calGoal = session ? config.nutrition.caloriesTraining : config.nutrition.caloriesRest;
  return (
    <div style={{ marginTop: 14, background: "#fff", border: "0.5px solid #ddd", borderRadius: 12, overflow: "hidden" }}>
      <div style={{ background: "#1a1a1a", color: "#fff", padding: "10px 14px", fontSize: 13, fontWeight: 500, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span>{label}</span>
        <span style={{ fontSize: 11, color: "#aaa" }}>{session ? "Training day" : "Rest day"}</span>
      </div>
      <div style={{ padding: 14 }}>
        {session && (
          <div style={{ background: "#f5f5f3", borderRadius: 8, padding: "10px 12px", marginBottom: 14 }}>
            <div style={{ fontSize: 12, fontWeight: 500, marginBottom: 6 }}>{session.title}</div>
            <div style={{ display: "flex", gap: 10 }}>
              {[["difficulty", (session.difficulty_kg || "-") + " kg"], ["completion", (session.completion_pct || "-") + "%"], ["duration", (session.actual_duration || "-") + " min"]].map(function(item) {
                return <div key={item[0]} style={{ flex: 1, textAlign: "center" }}><div style={{ fontSize: 15, fontWeight: 500 }}>{item[1]}</div><div style={{ fontSize: 10, color: "#aaa" }}>{item[0]}</div></div>;
              })}
            </div>
          </div>
        )}
        {activity && (
          <div style={{ background: "#f5f5f3", borderRadius: 8, padding: "10px 12px", marginBottom: 14 }}>
            <div style={{ fontSize: 12, fontWeight: 500, marginBottom: 6 }}>{activity.type}</div>
            <div style={{ display: "flex", gap: 10 }}>
              {[["duration", (activity.duration || "-") + " min"], ["burned", (activity.calories_burned || "-") + " kcal"], ["avg HR", (activity.avg_hr || "-") + " bpm"]].map(function(item) {
                return <div key={item[0]} style={{ flex: 1, textAlign: "center" }}><div style={{ fontSize: 15, fontWeight: 500 }}>{item[1]}</div><div style={{ fontSize: 10, color: "#aaa" }}>{item[0]}</div></div>;
              })}
            </div>
            {activity.notes && <div style={{ fontSize: 11, color: "#888", marginTop: 6, fontStyle: "italic" }}>{activity.notes}</div>}
          </div>
        )}
        {summary && (
          <div style={{ marginBottom: 14 }}>
            <MacroBar label="Calories" value={summary.calories || 0} goal={calGoal} color="#a5f3fc" />
            <MacroBar label="Protein"  value={summary.protein  || 0} goal={config.nutrition.protein} color="#86efac" />
            <MacroBar label="Carbs"    value={summary.carbs    || 0} goal={session ? config.nutrition.carbsTraining : config.nutrition.carbsRest} color="#fde68a" />
            <MacroBar label="Fat"      value={summary.fat      || 0} goal={session ? config.nutrition.fatTraining  : config.nutrition.fatRest}  color="#fca5a5" />
          </div>
        )}
        <div style={{ borderTop: "0.5px solid #eee", paddingTop: 14, marginBottom: 14 }}>
          <div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 10 }}>OMRON READING</div>
<div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 10 }}>
  <div>
    <div style={{ fontSize: 10, color: "#aaa", fontWeight: 500, marginBottom: 4 }}>WEIGHT (KG)</div>
    <Stepper value={weight} onChange={function(v) { setWeight(v); setOmronSaved(false); }} step={0.1} placeholder="kg" />
  </div>
  <div>
    <div style={{ fontSize: 10, color: "#aaa", fontWeight: 500, marginBottom: 4 }}>BODY FAT %</div>
    <Stepper value={bf} onChange={function(v) { setBf(v); setOmronSaved(false); }} step={0.1} placeholder="%" />
  </div>
  <div>
    <div style={{ fontSize: 10, color: "#aaa", fontWeight: 500, marginBottom: 4 }}>VISCERAL FAT (1–59)</div>
    <Stepper value={visceralFat} onChange={function(v) { setVisceralFat(v); setOmronSaved(false); }} step={1} placeholder="1–59" />
  </div>
</div>
          {leanMass && fatMass && (
            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              {[["Lean mass", leanMass + " kg"], ["Fat mass", fatMass + " kg"]].map(function(item) {
                return <div key={item[0]} style={{ flex: 1, background: "#f5f5f3", borderRadius: 8, padding: "7px 10px", textAlign: "center" }}>
                  <div style={{ fontSize: 14, fontWeight: 500 }}>{item[1]}</div>
                  <div style={{ fontSize: 10, color: "#aaa" }}>{item[0]}</div>
                </div>;
              })}
            </div>
          )}
          <button onClick={saveOmron} style={{ width: "100%", padding: 12, background: omronSaved ? "#2d7a4f" : "#1a1a1a", color: "#fff", border: "none", borderRadius: 10, fontSize: 13, fontWeight: 500, cursor: "pointer" }}>{omronSaved ? "Saved" : "Save Omron reading"}</button>
        </div>
        <div style={{ borderTop: "0.5px solid #eee", marginTop: 14, paddingTop: 14 }}>
          <div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 8 }}>CALORIES BURNED (PIXEL WATCH — RAW)</div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <input type="number" inputMode="numeric" value={burnInput} onChange={function(e) { setBurnInput(e.target.value); setSaved(false); }} placeholder="e.g. 2680" style={{ flex: 1, padding: "10px 12px", border: "0.5px solid #ccc", borderRadius: 8, fontSize: 15, fontWeight: 500 }} />
            <button onClick={saveBurn} style={{ padding: "10px 18px", background: "#1a1a1a", color: "#fff", border: "none", borderRadius: 8, fontSize: 13, fontWeight: 500, cursor: "pointer" }}>{saved ? "Saved" : "Save"}</button>
          </div>
          {correctedBurn && <div style={{ marginTop: 8, fontSize: 12, color: "#888" }}>Corrected: <strong>{correctedBurn} kcal</strong> (×{correction})</div>}
        </div>
      </div>
    </div>
  );
}

function WeekDetail({ weekKey, prevWeeklyRow, weeklyRow }) {
  function delta(curr, prev, unit, invertColor) {
    if (curr == null || prev == null) return null;
    var d = Math.round((curr - prev) * 10) / 10;
    var isGood = invertColor ? d < 0 : d > 0;
    var color = d === 0 ? "#888" : isGood ? "#166534" : "#dc2626";
    return <span style={{ fontSize: 11, color: color, marginLeft: 4 }}>{d > 0 ? "+" : ""}{d}{unit}</span>;
  }
  var wr = weeklyRow || {};
  var pw = prevWeeklyRow || {};
  var totalMeals = wr.total_meals || 0;
  var eatOutPct  = totalMeals > 0 ? Math.round((wr.eat_out_meals / totalMeals) * 100) : null;
  var hasBodyComp = wr.avg_bodyweight != null || wr.avg_body_fat != null;
  return (
    <div style={{ background: "#fff", border: "0.5px solid #ddd", borderTop: "none", borderRadius: "0 0 10px 10px", padding: 14, marginBottom: 8 }}>
      {wr.week_key && (
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 10 }}>WEEK RECAP</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
            {[
              ["Sessions", wr.sessions || 0],
              ["Total volume", (wr.total_difficulty || 0) + " kg"],
              ["Avg energy balance", wr.avg_energy_balance != null ? wr.avg_energy_balance + " kcal" : "-"],
              ["Eat-out", eatOutPct !== null ? eatOutPct + "%" : "-"]
            ].map(function(item) {
              return <div key={item[0]} style={{ background: "#f5f5f3", borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
                <div style={{ fontSize: 15, fontWeight: 500 }}>{item[1]}</div>
                <div style={{ fontSize: 10, color: "#aaa" }}>{item[0]}</div>
              </div>;
            })}
          </div>
        </div>
      )}
      <div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 10 }}>BODY COMPOSITION — WEEKLY AVG</div>
      {hasBodyComp ? (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 8 }}>
          <div style={{ background: "#f5f5f3", borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
            <div style={{ fontSize: 15, fontWeight: 500 }}>{wr.avg_bodyweight != null ? wr.avg_bodyweight + " kg" : "—"}{wr.avg_bodyweight != null && pw.avg_bodyweight != null ? delta(wr.avg_bodyweight, pw.avg_bodyweight, "kg", false) : null}</div>
            <div style={{ fontSize: 10, color: "#aaa" }}>avg weight</div>
          </div>
          <div style={{ background: "#f5f5f3", borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
            <div style={{ fontSize: 15, fontWeight: 500 }}>{wr.avg_body_fat != null ? wr.avg_body_fat + "%" : "—"}{wr.avg_body_fat != null && pw.avg_body_fat != null ? delta(wr.avg_body_fat, pw.avg_body_fat, "%", false) : null}</div>
            <div style={{ fontSize: 10, color: "#aaa" }}>avg BF%</div>
          </div>
          <div style={{ background: "#f5f5f3", borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
            <div style={{ fontSize: 15, fontWeight: 500 }}>{wr.avg_visceral_fat != null ? wr.avg_visceral_fat : "—"}{wr.avg_visceral_fat != null && pw.avg_visceral_fat != null ? delta(wr.avg_visceral_fat, pw.avg_visceral_fat, "", false) : null}</div>
            <div style={{ fontSize: 10, color: "#aaa" }}>avg visceral</div>
          </div>
        </div>
      ) : (
        <div style={{ fontSize: 12, color: "#aaa", textAlign: "center", padding: "10px 0 6px" }}>No Omron readings logged this week yet.</div>
      )}
    </div>
  );
}

function CalendarTab({ config, burnLogs, onSaveBurn, weekSessions, allSessions, activities, omronLogs, onSaveOmron, dailySummaryLogs, weeklySummaryLogs }) {
  var [viewDate, setViewDate] = useState(new Date()); var [calView, setCalView] = useState("daily");
  var [selectedISO, setSelectedISO] = useState(null); var [selectedWeek, setSelectedWeek] = useState(null);
  var year = viewDate.getFullYear(), month = viewDate.getMonth();
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
  var correction = config.training.pixelWatchCorrection; var today = todayISO();

function getWeeksInMonth() {
    var weeks = [];
    for (var d = 1; d <= daysInMonth; d++) {
      var iso = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
      var wk = getWeekKey(iso);
      if (!weeks.find(function(w) { return w.key === wk; })) {
        var start = new Date(getWeekStart(iso) + "T12:00:00");
        var end = new Date(start); end.setDate(start.getDate() + 6);
        weeks.push({ key: wk, label: start.toLocaleDateString("en", { month: "short", day: "numeric" }) + " – " + end.toLocaleDateString("en", { month: "short", day: "numeric" }) });
      }
    }
    return weeks;
  }

  function getPrevWeekKey(wk) {
    var parts = wk.split("_W"); var yr = parseInt(parts[0]); var wn = parseInt(parts[1]);
    if (wn === 1) return (yr - 1) + "_W52";
    return yr + "_W" + String(wn - 1).padStart(2, "0");
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <button onClick={function() { setViewDate(new Date(year, month - 1, 1)); setSelectedISO(null); setSelectedWeek(null); }} style={{ background: "none", border: "0.5px solid #ddd", borderRadius: 8, padding: "6px 12px", cursor: "pointer", fontSize: 14 }}>{"<"}</button>
        <span style={{ fontWeight: 500, fontSize: 14 }}>{viewDate.toLocaleDateString("en", { month: "long", year: "numeric" })}</span>
        <button onClick={function() { setViewDate(new Date(year, month + 1, 1)); setSelectedISO(null); setSelectedWeek(null); }} style={{ background: "none", border: "0.5px solid #ddd", borderRadius: 8, padding: "6px 12px", cursor: "pointer", fontSize: 14 }}>{">"}</button>
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        {[["daily","Daily"],["weekly","Weekly"]].map(function(item) {
          return <button key={item[0]} onClick={function() { setCalView(item[0]); setSelectedISO(null); setSelectedWeek(null); }} style={{ flex: 1, padding: "8px 0", borderRadius: 10, border: "0.5px solid #ccc", cursor: "pointer", fontWeight: 500, fontSize: 13, background: calView === item[0] ? "#1a1a1a" : "#fff", color: calView === item[0] ? "#fff" : "#666" }}>{item[1]}</button>;
        })}
      </div>

      {calView === "daily" && (
        <div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 8 }}>
            {["M","T","W","T","F","S","S"].map(function(d, i) { return <div key={i} style={{ textAlign: "center", fontSize: 11, color: "#aaa", fontWeight: 500 }}>{d}</div>; })}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
            {Array.from({ length: firstDay }, function(_, i) { return <div key={"b" + i} />; })}
            {Array.from({ length: daysInMonth }, function(_, i) {
              var day = i + 1;
              var iso = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
              var isToday = iso === today, isSelected = iso === selectedISO;
              var hasSession  = allSessions.some(function(s) { return s.date === iso; });
              var hasActivity = activities.some(function(a) { return a.date === iso; });
              var hasOmron    = !!omronLogs[iso];
              var summary = dailySummaryLogs[iso];
              var bg = dayCellBg(iso, burnLogs, dailySummaryLogs, correction);

              // Dots
              var dots = [];
              if (hasSession || hasActivity) dots.push({ color: "#2d7a4f", key: "g" });
              if (hasOmron) dots.push({ color: "#8b5cf6", key: "o" });
              if (summary) {
                if ((summary.protein || 0) < (config.nutrition.protein - 20))                    dots.push({ color: "#3b82f6", key: "b" });
                if ((summary.fat    || 0) > (config.nutrition.fatTraining + 15))                  dots.push({ color: "#f97316", key: "f" });
                if ((summary.carbs  || 0) > ((hasSession ? config.nutrition.carbsTraining : config.nutrition.carbsRest) + 30)) dots.push({ color: "#a855f7", key: "p" });
              }

              return (
                <div key={day} onClick={function() { setSelectedISO(isSelected ? null : iso); }}
                  style={{ background: bg, borderRadius: 8, minHeight: 44, border: isSelected ? "2px solid #1a1a1a" : isToday ? "2px solid #555" : "0.5px solid #d0d0ce", cursor: "pointer", overflow: "hidden", display: "flex", flexDirection: "column" }}>
                  <div style={{ padding: "5px 3px 3px", flex: 1 }}>
                    <div style={{ fontSize: 12, fontWeight: isToday ? 700 : 400, textAlign: "center", color: bg === "#166534" ? "#fff" : "#1a1a1a" }}>{day}</div>
                  </div>
                  {dots.length > 0 && (
                    <div style={{ background: "#fff", padding: "2px 3px", display: "flex", justifyContent: "center", gap: 2, flexWrap: "wrap" }}>
                      {dots.map(function(dot) { return <div key={dot.key} style={{ width: 6, height: 6, borderRadius: "50%", background: dot.color }} />; })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {selectedISO && <DayDetail iso={selectedISO} burnLogs={burnLogs} onSaveBurn={onSaveBurn} weekSessions={allSessions} activities={activities} dailySummaryLogs={dailySummaryLogs} correction={correction} config={config} omronLogs={omronLogs} onSaveOmron={onSaveOmron} />}

          <div style={{ marginTop: 12, display: "flex", gap: 8, flexWrap: "wrap" }}>
            {[["#166534","Deficit 300+"],["#bbf7d0","Deficit/neutral"],["#fde68a","Surplus <300"],["#fca5a5","Surplus 300+"],["#e8e8e6","No data"]].map(function(item) {
              return <div key={item[1]} style={{ display: "flex", alignItems: "center", gap: 3, fontSize: 10, color: "#666" }}>
                <div style={{ width: 10, height: 10, borderRadius: 2, background: item[0], border: "0.5px solid #ddd" }} />{item[1]}
              </div>;
            })}
          </div>
          <div style={{ marginTop: 6, display: "flex", gap: 8, flexWrap: "wrap" }}>
            {[["#2d7a4f","Session/activity"],["#8b5cf6","Omron logged"],["#3b82f6","Low protein"],["#f97316","High fat"],["#a855f7","High carbs"]].map(function(item) {
              return <div key={item[1]} style={{ display: "flex", alignItems: "center", gap: 3, fontSize: 10, color: "#666" }}>
                <div style={{ width: 6, height: 6, borderRadius: "50%", background: item[0] }} />{item[1]}
              </div>;
            })}
          </div>
        </div>
      )}

      {calView === "weekly" && (
        <div>
          {getWeeksInMonth().map(function(w) {
            var prevKey   = getPrevWeekKey(w.key);
            var weeklyRow = weeklySummaryLogs[w.key] || null;
            var prevWeeklyRow = weeklySummaryLogs[prevKey] || null;
            var avgW = weeklyRow && weeklyRow.avg_bodyweight != null ? weeklyRow.avg_bodyweight : null;
            var avgBf = weeklyRow && weeklyRow.avg_body_fat != null ? weeklyRow.avg_body_fat : null;
            return (
              <div key={w.key}>
                <div onClick={function() { setSelectedWeek(selectedWeek === w.key ? null : w.key); }}
                  style={{ background: "#fff", border: "0.5px solid #ddd", borderRadius: selectedWeek === w.key ? "10px 10px 0 0" : 10, padding: "12px 14px", marginBottom: selectedWeek === w.key ? 0 : 8, cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ fontSize: 13, fontWeight: 500 }}>{w.label}</span>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    {avgW != null && <span style={{ fontSize: 11, color: "#2d7a4f", fontWeight: 500 }}>{avgW} kg{avgBf != null ? " · " + avgBf + "% BF" : ""}</span>}
                    <span style={{ fontSize: 14, color: "#aaa" }}>{selectedWeek === w.key ? "^" : "v"}</span>
                  </div>
                </div>
                {selectedWeek === w.key && <WeekDetail weekKey={w.key} weeklyRow={weeklyRow} prevWeeklyRow={prevWeeklyRow} />}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── SETTINGS ──────────────────────────────────────────────────
function SettingsPanel({ config, onSave, onClose, onPatch }) {
  var [configInput, setConfigInput] = useState(""); var [patchInput, setPatchInput] = useState("");
  var [configErr, setConfigErr] = useState(""); var [patchErr, setPatchErr] = useState("");
  var [configSaved, setConfigSaved] = useState(false); var [patchSaved, setPatchSaved] = useState(false);
  return (
    <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.5)", zIndex: 100, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div style={{ background: "#f5f5f3", borderRadius: "16px 16px 0 0", padding: 16, width: "100%", maxWidth: 480, maxHeight: "85vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}><span style={{ fontWeight: 500, fontSize: 16 }}>Settings</span><button onClick={onClose} style={{ background: "none", border: "none", fontSize: 20, cursor: "pointer", color: "#888" }}>×</button></div>
        <Card><CardHdr left="App config (CONFIG)" /><div style={{ padding: 14 }}><div style={{ fontSize: 12, color: "#888", marginBottom: 8 }}>Paste CONFIG JSON to update athlete stats and nutrition targets.</div><textarea style={{ width: "100%", height: 80, padding: 10, border: "0.5px solid #ccc", borderRadius: 8, fontSize: 12, fontFamily: "monospace", resize: "vertical", marginBottom: 8 }} value={configInput} onChange={function(e) { setConfigInput(e.target.value); }} placeholder='{"athlete":{"weight":83.5,...}}' /><ActionBtn onClick={function() { setConfigErr(""); try { onSave(JSON.parse(configInput)); setConfigSaved(true); setTimeout(function() { setConfigSaved(false); }, 2000); } catch(e) { setConfigErr("Invalid JSON."); } }}>{configSaved ? "Saved" : "Save config"}</ActionBtn>{configErr && <div style={{ fontSize: 12, color: "#dc2626", marginTop: 6 }}>{configErr}</div>}</div></Card>
        <Card><CardHdr left="Data patch" /><div style={{ padding: 14 }}><div style={{ fontSize: 12, color: "#888", marginBottom: 8 }}>Backfill meals or log calorie overrides.</div><textarea style={{ width: "100%", height: 80, padding: 10, border: "0.5px solid #ccc", borderRadius: 8, fontSize: 12, fontFamily: "monospace", resize: "vertical", marginBottom: 8 }} value={patchInput} onChange={function(e) { setPatchInput(e.target.value); }} placeholder='{"type":"nutrition_entry",...} or {"type":"activity","date":"2026-04-06","activity_type":"Hike","duration":185,"calories_burned":1240,"avg_hr":118,"peak_hr":148,"zone_minutes":{"z1":20,"z2":95},"elevation_gain":820,"notes":"..."}' /><ActionBtn onClick={function() { setPatchErr(""); try { onPatch(JSON.parse(patchInput)); setPatchSaved(true); setTimeout(function() { setPatchSaved(false); setPatchInput(""); }, 2000); } catch(e) { setPatchErr("Invalid JSON."); } }}>{patchSaved ? "Patched" : "Apply patch"}</ActionBtn>{patchErr && <div style={{ fontSize: 12, color: "#dc2626", marginTop: 6 }}>{patchErr}</div>}</div></Card>
        <Card><CardHdr left="Sheet sync" /><div style={{ padding: 14 }}><div style={{ fontSize: 12, color: "#888", marginBottom: 8 }}>Rebuild the entire Google Sheet from Supabase. Use after bulk data imports or if the sheet looks out of sync.</div><ActionBtn onClick={function() { syncSheet(); onClose(); }}>Rebuild Google Sheet</ActionBtn></div></Card>
        <Card><CardHdr left="Current config" /><div style={{ padding: 14 }}>{[["Weight", config.athlete.weight + " kg"],["SMM", config.athlete.smm + " kg"],["BF%", config.athlete.bf + "%"],["Scan date", config.athlete.scanDate],["Cal training", config.nutrition.caloriesTraining + " kcal"],["Cal rest", config.nutrition.caloriesRest + " kcal"],["Protein", config.nutrition.protein + "g"],["HRmax", config.training.hmaxBpm + " bpm"],["PW correction", (config.training.pixelWatchCorrection * 100) + "%"]].map(function(item) { return <div key={item[0]} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "4px 0", borderBottom: "0.5px solid #f0f0f0" }}><span style={{ color: "#888" }}>{item[0]}</span><span style={{ fontWeight: 500 }}>{item[1]}</span></div>; })}</div></Card>
      </div>
    </div>
  );
}

// ── ROOT ──────────────────────────────────────────────────────
function App() {
  var [tab, setTab] = useState("dashboard");
  var [config, setConfig] = useState(function() { try { var r = localStorage.getItem("hh_config"); return r ? JSON.parse(r) : DEFAULT_CONFIG; } catch(e) { return DEFAULT_CONFIG; } });
  var [todayLogs, setTodayLogs] = useState([]);
  var [burnLogs, setBurnLogs] = useState({});
  var [omronLogs, setOmronLogs] = useState({});
  var [calOverrides, setCalOverrides] = useState(function() { try { var r = localStorage.getItem("hh_cal_overrides"); return r ? JSON.parse(r) : {}; } catch(e) { return {}; } });
  var [weekSessions, setWeekSessions] = useState([]);
  var [weeklyRow, setWeeklyRow] = useState(null);
  var [lastSessionSets, setLastSessionSets] = useState([]);
  var [allSessions, setAllSessions] = useState([]);
  var [activities, setActivities] = useState([]);
  var [dailySummaryLogs, setDailySummaryLogs] = useState({});
  var [weeklySummaryLogs, setWeeklySummaryLogs] = useState({});
  var [showSettings, setShowSettings] = useState(false);
  var [loading, setLoading] = useState(true);

  // Midnight reload
  var loadedDate = useRef(todayISO());
  useEffect(function() {
    var interval = setInterval(function() { if (todayISO() !== loadedDate.current) window.location.reload(); }, 60000);
    return function() { clearInterval(interval); };
  }, []);

  // Load on mount
  useEffect(function() {
    async function load() {
      var td = todayISO();
      var wkStart = getWeekStart(td);
      var wkEnd = getWeekEnd(td);
      var wkKey = getWeekKey(td);

      try {
        // Today's meals
        var meals = await supabaseQuery({
          action: "select", table: "meals",
          filters: [{ column: "date", op: "eq", value: td }],
          order: "logged_at.asc"
        });
        if (Array.isArray(meals)) setTodayLogs(meals);

        // This week's sessions
        var sessions = await supabaseQuery({
          action: "select", table: "training_sessions",
          filters: [{ column: "date", op: "gte", value: wkStart }, { column: "date", op: "lte", value: wkEnd }],
          order: "date.asc"
        });
        if (Array.isArray(sessions)) setWeekSessions(sessions);

        // Last session sets (for reference line during training)
        if (Array.isArray(sessions) && sessions.length) {
          var lastSession = sessions[sessions.length - 1];
          var sets = await supabaseQuery({
            action: "select", table: "session_sets",
            filters: [{ column: "session_id", op: "eq", value: lastSession.id }],
            order: "set_number.asc"
          });
          if (Array.isArray(sets)) setLastSessionSets(sets);
        }

        // Weekly summary row
        var weekly = await supabaseQuery({
          action: "select", table: "weekly_summary",
          filters: [{ column: "week_key", op: "eq", value: wkKey }]
        });
        if (Array.isArray(weekly) && weekly.length) setWeeklyRow(weekly[0]);

        // All sessions (for calendar dot + day detail)
        var allSessionsData = await supabaseQuery({
          action: "select", table: "training_sessions",
          order: "date.asc"
        });
        if (Array.isArray(allSessionsData)) setAllSessions(allSessionsData);

        // All activities
        var activitiesData = await supabaseQuery({
          action: "select", table: "activities",
          order: "date.asc"
        });
        if (Array.isArray(activitiesData)) setActivities(activitiesData);

        // All daily summaries (for calendar colors + day detail)
        var dailyData = await supabaseQuery({
          action: "select", table: "daily_summary",
          order: "date.asc"
        });
        if (Array.isArray(dailyData)) {
          var dailyMap = {};
          dailyData.forEach(function(r) { dailyMap[r.date] = r; });
          setDailySummaryLogs(dailyMap);
          var burns = {};
          dailyData.forEach(function(r) { if (r.calories_burned) burns[r.date] = r.calories_burned; });
          setBurnLogs(burns);
        }

        // All weekly summaries (for weekly recap)
        var weeklyData = await supabaseQuery({
          action: "select", table: "weekly_summary",
          order: "week_start.asc"
        });
        if (Array.isArray(weeklyData)) {
          var weeklyMap = {};
          weeklyData.forEach(function(r) { weeklyMap[r.week_key] = r; });
          setWeeklySummaryLogs(weeklyMap);
          if (weeklyMap[wkKey]) setWeeklyRow(weeklyMap[wkKey]);
        }

        // All Omron readings (date → row map for daily input)
        var allOmron = await supabaseQuery({
          action: "select", table: "body_composition",
          order: "entry_date.asc"
        });
        if (Array.isArray(allOmron)) {
          var omronMap = {};
          allOmron.forEach(function(r) {
            omronMap[r.entry_date] = r;
          });
          setOmronLogs(omronMap);
        }

      } catch(e) { console.error("Load error:", e); }
      setLoading(false);
    }
    load();
  }, []);

  function getTodayCalGoal() {
    var td = todayISO();
    var isTraining = weekSessions.some(function(s) { return s.date === td; });
    return calOverrides[td] || (isTraining ? config.nutrition.caloriesTraining : config.nutrition.caloriesRest);
  }

  async function handleAddMeal(entry) {
    var td = todayISO();
    var row = {
      date: td,
      logged_at: new Date().toISOString(),
      meal_type: entry.meal_type,
      food: entry.name || entry.food,
      description: entry.description || "",
      calories: entry.cal,
      protein: entry.protein,
      carbs: entry.carbs,
      fat: entry.fat,
      is_eat_out: entry.is_eat_out || false,
      restaurant_type: entry.restaurant_type || ""
    };
    // Optimistic update with temp id
var tempId = "tmp_" + Date.now();
    var newEntry = Object.assign({ id: tempId, cal: entry.cal }, row);
    setTodayLogs(function(prev) { return prev.concat([newEntry]); });
    try {
      var result = await supabaseQuery({ action: "insert", table: "meals", data: row });
      var realEntry = (Array.isArray(result) && result[0]) ? Object.assign({ cal: entry.calories || entry.cal }, result[0]) : newEntry;
      var currentLogs = todayLogs.concat([realEntry]);
      setTodayLogs(function(prev) { return prev.map(function(e) { return e.id === tempId ? realEntry : e; }); });
      await upsertDailySummary(td, currentLogs);
      syncSheet();
    } catch(e) {
      setTodayLogs(function(prev) { return prev.filter(function(e) { return e.id !== tempId; }); });
    }
  }

  async function handleDeleteMeal(id) {
    setTodayLogs(function(prev) { return prev.filter(function(e) { return e.id !== id; }); });
    try {
      await supabaseQuery({ action: "delete", table: "meals", filters: [{ column: "id", op: "eq", value: id }] });
      var td = todayISO();
      await upsertDailySummary(td);
      syncSheet();
    } catch(e) { console.error("Delete meal error:", e); }
  }

async function upsertDailySummaryForDate(date) {
    var isTraining = allSessions.some(function(s) { return s.date === date; });
    var calGoal = calOverrides[date] || (isTraining ? config.nutrition.caloriesTraining : config.nutrition.caloriesRest);
    upsertDailySummaryWithGoal(date, calGoal);
  }

  async function upsertDailySummary(td, logsOverride) {    var calGoal = getTodayCalGoal();
    upsertDailySummaryWithGoal(td, calGoal, logsOverride);
  }

 async function upsertDailySummaryWithGoal(td, calGoal, logsOverride) {
    var logs = logsOverride || todayLogs;
    if (!logsOverride) {
      try {
        var fresh = await supabaseQuery({ action: "select", table: "meals", filters: [{ column: "date", op: "eq", value: td }] });
        if (Array.isArray(fresh)) logs = fresh;
      } catch(e) {}
    }
    var totals = logs.reduce(function(a, e) { return { cal: a.cal + (e.calories || e.cal || 0), protein: a.protein + (e.protein||0), carbs: a.carbs + (e.carbs||0), fat: a.fat + (e.fat||0) }; }, { cal: 0, protein: 0, carbs: 0, fat: 0 });
    var MAIN_MEALS = ["Breakfast", "Lunch", "Dinner"];
    var eatOut = MAIN_MEALS.filter(function(m) {
      return logs.some(function(e) { return e.is_eat_out && (e.meal_type === m || e.meal_type === m); });
    }).length;
    var burn = burnLogs[td];
    var corrected = burn ? Math.round(burn * config.training.pixelWatchCorrection) : null;
    var row = {
      date: td,
      calories: totals.cal,
      protein: totals.protein,
      carbs: totals.carbs,
      fat: totals.fat,
      calorie_goal: calGoal,
      calorie_delta: totals.cal - calGoal,
      protein_goal: config.nutrition.protein,
      protein_delta: totals.protein - config.nutrition.protein,
      calories_burned: burn || null,
      energy_balance: corrected ? totals.cal - corrected : null,
      eat_out_meals: eatOut
    };
    supabaseQuery({ action: "upsert", table: "daily_summary", data: row }).catch(function(e) { console.error("daily_summary upsert error:", e); });
  }

  async function handleSaveBurn(iso, value) {
    setBurnLogs(function(prev) { var n = Object.assign({}, prev); n[iso] = value; return n; });
    var corrected = Math.round(value * config.training.pixelWatchCorrection);
    try {
      var existing = await supabaseQuery({ action: "select", table: "daily_summary", filters: [{ column: "date", op: "eq", value: iso }] });
      var base = (Array.isArray(existing) && existing[0]) || { date: iso };
      var cal = base.calories || 0;
      await supabaseQuery({ action: "upsert", table: "daily_summary", data: Object.assign({}, base, { calories_burned: value, energy_balance: cal ? cal - corrected : null }) });
      syncSheet();
    } catch(e) { console.error("Save burn error:", e); }
  }

  async function handleSaveOmron(date, weight, bf, visceralFat) {
    var leanMass = Math.round(weight * (1 - bf / 100) * 10) / 10;
    var fatMass  = Math.round(weight * (bf  / 100) * 10) / 10;
    var row = { entry_date: date, bodyweight: weight, body_fat: bf, lean_mass: leanMass, fat_mass: fatMass, visceral_fat: visceralFat || null };
    setOmronLogs(function(prev) { var n = Object.assign({}, prev); n[date] = row; return n; });
    try {
      await supabaseQuery({ action: "upsert", table: "body_composition", data: row });
      syncSheet();
    } catch(e) { console.error("Omron save error:", e); }
  }

  function handleSessionSaved(rec) {
    setWeekSessions(function(prev) { return prev.concat([rec]); });
  }

  function handleConfigSave(c) { setConfig(c); localStorage.setItem("hh_config", JSON.stringify(c)); }

  function handlePatch(patch) {
    if (patch.type === "nutrition_entry") {
      var entry = { meal_type: patch.meal_type || "Dinner", food: patch.food, cal: patch.calories || patch.cal, calories: patch.calories || patch.cal, protein: patch.protein, carbs: patch.carbs, fat: patch.fat, is_eat_out: patch.is_eat_out || false, restaurant_type: patch.restaurant_type || "", description: patch.description || "" };
      if (!patch.date || patch.date === todayISO()) {
        handleAddMeal(entry);
      } else {
        var row = { date: patch.date, meal_type: entry.meal_type, food: entry.food, description: entry.description, calories: entry.calories || entry.cal, protein: entry.protein, carbs: entry.carbs, fat: entry.fat, is_eat_out: entry.is_eat_out, restaurant_type: entry.restaurant_type };supabaseQuery({ action: "insert", table: "meals", data: row })
          .then(function() {
            upsertDailySummaryForDate(patch.date);
            syncSheet();
          })
          .catch(function() {});
      }
 } else if (patch.type === "calorie_override") {
      var updated = Object.assign({}, calOverrides); updated[patch.date] = patch.caloriesOverride;
      setCalOverrides(updated); localStorage.setItem("hh_cal_overrides", JSON.stringify(updated));
    } else if (patch.type === "activity") {
      var row = {
        date: patch.date,
        type: patch.activity_type || "",
        duration: patch.duration || null,
        calories_burned: patch.calories_burned || null,
        avg_hr: patch.avg_hr || null,
        peak_hr: patch.peak_hr || null,
        zone_minutes: patch.zone_minutes || null,
        elevation_gain: patch.elevation_gain || null,
        notes: patch.notes || ""
      };
      supabaseQuery({ action: "insert", table: "activities", data: row })
        .then(function() {
          setActivities(function(prev) { return prev.concat([row]); });
          syncSheet();
        })
        .catch(function(e) { console.error("Activity patch error:", e); });
    }
  }

  var td = todayISO();
  var isTrainingDay = weekSessions.some(function(s) { return s.date === td; });
  var calOverrideToday = calOverrides[td] || null;
  var calGoal = calOverrideToday || (isTrainingDay ? config.nutrition.caloriesTraining : config.nutrition.caloriesRest);
  var carbGoal = isTrainingDay ? config.nutrition.carbsTraining : config.nutrition.carbsRest;
  var fatGoal = isTrainingDay ? config.nutrition.fatTraining : config.nutrition.fatRest;

  if (loading) return (
    <div style={{ fontFamily: "system-ui,sans-serif", background: "#f5f5f3", minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
      <div style={{ fontSize: 20, fontWeight: 500, marginBottom: 24 }}>Gym Fra</div>
      <Loader />
    </div>
  );

  return (
    <div style={{ fontFamily: "system-ui,sans-serif", background: "#f5f5f3", color: "#1a1a1a", minHeight: "100vh", maxWidth: 480, margin: "0 auto", padding: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div style={{ fontSize: 20, fontWeight: 500 }}>Gym Fra</div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 11, color: "#aaa" }}>{config.athlete.weight} kg · {config.athlete.bf}% BF</span>
          <button style={{ background: "none", border: "0.5px solid #ddd", borderRadius: 8, padding: "6px 10px", cursor: "pointer", fontSize: 14, color: "#888" }} onClick={function() { setShowSettings(true); }}>settings</button>
        </div>
      </div>
      <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
        {[["dashboard","Dashboard"],["nutrition","Nutrition"],["training","Training"],["calendar","Calendar"]].map(function(item) { return <button key={item[0]} onClick={function() { setTab(item[0]); }} style={{ flex: 1, padding: "9px 0", borderRadius: 20, border: "0.5px solid " + (tab === item[0] ? "#1a1a1a" : "#ddd"), cursor: "pointer", fontWeight: 500, fontSize: 13, background: tab === item[0] ? "#1a1a1a" : "#fff", color: tab === item[0] ? "#fff" : "#888" }}>{item[1]}</button>; })}
      </div>
      {tab === "dashboard" && <Dashboard config={config} todayLogs={todayLogs} calGoal={calGoal} carbGoal={carbGoal} fatGoal={fatGoal} isTrainingDay={isTrainingDay} weekSessions={weekSessions} weeklyRow={weeklyRow} onTabChange={setTab} weeklySummaryLogs={weeklySummaryLogs} activities={activities} />}      {tab === "nutrition" && <NutritionTab config={config} todayLogs={todayLogs} onAddMeal={handleAddMeal} onDeleteMeal={handleDeleteMeal} isTrainingDay={isTrainingDay} calOverride={calOverrideToday} />}
      {tab === "training" && <TrainingTab config={config} onSessionSaved={handleSessionSaved} lastSessionSets={lastSessionSets} />}
      {tab === "calendar" && <CalendarTab config={config} burnLogs={burnLogs} onSaveBurn={handleSaveBurn} weekSessions={weekSessions} allSessions={allSessions} activities={activities} omronLogs={omronLogs} onSaveOmron={handleSaveOmron} dailySummaryLogs={dailySummaryLogs} weeklySummaryLogs={weeklySummaryLogs} />}
      {showSettings && <SettingsPanel config={config} onSave={handleConfigSave} onClose={function() { setShowSettings(false); }} onPatch={handlePatch} />}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
