<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Gym Fra</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f5f5f3; font-family: system-ui, sans-serif; color: #1a1a1a; }
input, select, textarea, button { font-family: inherit; }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, memo, useCallback } = React;

const PROXY = "https://heavy-hybrid.vercel.app/api/proxy";

// ── API ───────────────────────────────────────────────────────

// Supabase read/write through proxy
// action: "select" | "insert" | "upsert" | "delete"
// table: table name
// data: object or array (for insert/upsert)
// filters: [{ column, op, value }] — op: eq | gte | lte | gt | lt
// order: "column.asc" | "column.desc"
// limit: number
async function supabaseQuery({ action, table, data, filters, order, limit }) {
  var res = await fetch(PROXY + "?target=supabase", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, table, data, filters, order, limit })
  });
  if (!res.ok) throw new Error("Supabase error: " + res.status);
  return res.json();
}

// Trigger a full sheet rebuild from Supabase
function syncSheet() {
  fetch(PROXY + "?target=sync-sheet", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({})
  }).catch(function() {});
}

async function estimateFood(text, isEatOut, restaurantType) {
  var context = isEatOut
    ? "This is an EAT-OUT meal" + (restaurantType ? " at a " + restaurantType : "") + "."
    : "This is a HOME-COOKED meal.";
  var res = await fetch(PROXY, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514", max_tokens: 500, temperature: 0,
system: "You are a nutrition expert estimating calories and macros. Estimates must be accurate and consistent.\n\nRules:\n- HOME meals: typical Italian home portions.\n- EAT-OUT meals: restaurant portions, 20-30% larger and higher in fat than home.\n- If ambiguous, assume most common Italian interpretation.\n\nYou MUST show your reasoning as a component-by-component calorie breakdown, then sum to total. Example: '90g pasta (330) + 60g guanciale (280) + 2 eggs (140) + 40g pecorino (160) = 910 kcal'.\n\nReply ONLY with raw JSON: {\"name\":\"<english name>\",\"cal\":<int>,\"protein\":<int>,\"carbs\":<int>,\"fat\":<int>,\"reasoning\":\"<component breakdown with kcal per item and total>\"}",      messages: [{ role: "user", content: context + " " + text }]
    })
  });
  if (!res.ok) { var err = await res.json().catch(function() { return {}; }); throw new Error((err.error && err.error.message) || "HTTP " + res.status); }
  var data = await res.json();
  var block = data.content.find(function(b) { return b.type === "text"; });
  return JSON.parse((block ? block.text : "").replace(/```json|```/g, "").trim());
}

async function generateWeeklyReport(weekData, config) {
  var res = await fetch(PROXY, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514", max_tokens: 500, temperature: 0,
      system: "You are an analytical performance coach. Analyse the weekly nutrition and training data and return a concise structured report. Be direct, data-driven, no flattery. Cover: avg daily calories vs target, protein compliance, energy balance trend, eat-out vs home breakdown, training sessions, one specific recommendation for next week. Under 200 words.",
      messages: [{ role: "user", content: "Weekly data: " + JSON.stringify(weekData) + "\nTargets: cal training=" + config.nutrition.caloriesTraining + " rest=" + config.nutrition.caloriesRest + " protein=" + config.nutrition.protein + "g phase=" + config.goals.phase }]
    })
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  var data = await res.json();
  var block = data.content.find(function(b) { return b.type === "text"; });
  return block ? block.text : "";
}

// ── UTILS ─────────────────────────────────────────────────────
function todayISO() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fmtDate(iso) {
  var t = todayISO(); var y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if (iso === t) return "Today"; if (iso === y) return "Yesterday";
  return new Date(iso + "T12:00:00").toLocaleDateString("en", { weekday: "short", month: "short", day: "numeric" });
}
function fmtTime(s) { var m = Math.floor(s / 60); var sec = s % 60; return m + ":" + (sec < 10 ? "0" : "") + sec; }
function getWeekKey(iso) {
  var d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));
  var jan1 = new Date(d.getFullYear(), 0, 1);
  var week = Math.ceil(((d - jan1) / 86400000 + 1) / 7);
  return d.getFullYear() + "_W" + String(week).padStart(2, "0");
}
function getWeekStart(iso) {
  var d = new Date(iso + "T12:00:00"); var day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day); return d.toISOString().slice(0, 10);
}
function getWeekEnd(iso) {
  var d = new Date(getWeekStart(iso) + "T12:00:00");
  d.setDate(d.getDate() + 6); return d.toISOString().slice(0, 10);
}
function beep() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18, 0.36].forEach(function(t) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.6, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.12);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.13);
    });
  } catch(e) {}
}
function badgeStyle(zc) {
  var m = { z2: ["#dbeafe","#1e40af"], z3: ["#dcfce7","#166534"], z4: ["#fef9c3","#854d0e"], z5: ["#fee2e2","#991b1b"] };
  var p = m[zc] || ["#eee","#333"];
  return { fontSize: 11, padding: "3px 8px", borderRadius: 20, fontWeight: 500, background: p[0], color: p[1] };
}
function rirOptStyle(val, active) {
  var m = { 4: ["#dcfce7","#2d7a4f","#166534"], 3: ["#dbeafe","#3b82f6","#1e40af"], 2: ["#fef9c3","#ca8a04","#854d0e"], 1: ["#fee2e2","#dc2626","#991b1b"] };
  var t = m[val];
  return { flex: 1, padding: "10px 4px", borderRadius: 8, border: active ? "0.5px solid " + t[1] : "0.5px solid #ccc", background: active ? t[0] : "#fff", textAlign: "center", cursor: "pointer", color: active ? t[2] : "#1a1a1a" };
}

var MEALS = ["Breakfast", "Lunch", "Dinner", "Snack"];
var RIR_MAP = { 4: "Cruise", 3: "Comfortable", 2: "Edge", 1: "Limit" };
var RIR_LABELS = [{ val: 4, label: "Cruise", sub: "4+ left" }, { val: 3, label: "Comfortable", sub: "2-3 left" }, { val: 2, label: "Edge", sub: "1-2 left" }, { val: 1, label: "Limit", sub: "0/DNF" }];
var DEFAULT_CONFIG = {
  athlete: { name: "Gym Fra", weight: 83.5, smm: 38.1, bf: 20.7, scanDate: "March 27, 2026" },
  nutrition: { caloriesTraining: 2300, caloriesRest: 1900, protein: 170, carbsTraining: 248, carbsRest: 170, fatTraining: 70, fatRest: 60 },
  training: { hmaxBpm: 192, pixelWatchCorrection: 0.80 },
  goals: { phase: "cut", targetBf: 14, targetWeight: 77.9 }
};

// ── SHARED COMPONENTS ─────────────────────────────────────────
function Card({ children, style }) { return <div style={Object.assign({ background: "#fff", border: "0.5px solid #ddd", borderRadius: 12, marginBottom: 12, overflow: "hidden" }, style || {})}>{children}</div>; }
function CardHdr({ left, right }) { return <div style={{ background: "#1a1a1a", color: "#fff", padding: "10px 14px", fontSize: 13, fontWeight: 500, display: "flex", justifyContent: "space-between", alignItems: "center" }}><span>{left}</span><span>{right}</span></div>; }
function ActionBtn({ onClick, secondary, disabled, children }) { return <button onClick={onClick} disabled={disabled} style={{ width: "100%", padding: 13, background: disabled ? "#ccc" : secondary ? "#fff" : "#1a1a1a", color: secondary ? "#1a1a1a" : "#fff", border: secondary ? "0.5px solid #ccc" : "none", borderRadius: 10, fontSize: 14, fontWeight: 500, cursor: disabled ? "default" : "pointer", marginBottom: 8 }}>{children}</button>; }
function Stepper({ value, onChange, step, placeholder, compact }) {
  var v = parseFloat(value) || 0;
  var btnW = compact ? 36 : 48;
  return (
    <div style={{ display: "flex", alignItems: "center", border: "0.5px solid #ccc", borderRadius: 8, overflow: "hidden", background: "#fff", height: 48 }}>
      <button style={{ width: btnW, height: 48, minWidth: btnW, border: "none", background: "#f5f5f3", cursor: "pointer", fontSize: 20, color: "#333" }} onClick={function() { onChange(String(Math.max(0, Math.round((v - step) * 100) / 100))); }}>-</button>
      <input type="number" inputMode={step < 1 ? "decimal" : "numeric"} style={{ flex: 1, border: "none", textAlign: "center", fontSize: 18, fontWeight: 500, background: "#fff", minWidth: 0, padding: 0, height: 48 }} value={value} placeholder={placeholder} onChange={function(e) { onChange(e.target.value); }} />
      <button style={{ width: btnW, height: 48, minWidth: btnW, border: "none", background: "#f5f5f3", cursor: "pointer", fontSize: 20, color: "#333" }} onClick={function() { onChange(String(Math.round((v + step) * 100) / 100)); }}>+</button>
    </div>
  );
}
function MacroBar({ label, value, goal, color }) {
  var over = value > goal; var pct = Math.min((value / goal) * 100, 100);
  return (
    <div style={{ marginBottom: 8 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}><span style={{ fontWeight: 500 }}>{label}</span><span style={{ color: over ? "#ef4444" : "#888" }}>{value} / {goal}{label === "Calories" ? " kcal" : "g"}</span></div>
      <div style={{ background: "#e5e7eb", borderRadius: 99, height: 8, overflow: "hidden", marginTop: 3 }}><div style={{ width: pct + "%", background: over ? "#ef4444" : color, height: "100%", borderRadius: 99 }} /></div>
    </div>
  );
}
function SyncStatus({ status }) {
  if (!status) return null;
  return <div style={{ fontSize: 12, padding: "6px 10px", borderRadius: 8, background: status === "ok" ? "#dcfce7" : "#fee2e2", color: status === "ok" ? "#166534" : "#991b1b", marginBottom: 8 }}>{status === "ok" ? "✓ Saved" : "⚠ Save failed — will retry"}</div>;
}
function Loader() {
  return <div style={{ display: "flex", justifyContent: "center", alignItems: "center", padding: 40, flexDirection: "column", gap: 16 }}>
    <div style={{ width: 24, height: 24, border: "2px solid #ddd", borderTop: "2px solid #1a1a1a", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} />
    <div style={{ fontSize: 13, color: "#aaa" }}>Loading your data...</div>
  </div>;
}

// ── WEEKLY SUMMARY ────────────────────────────────────────────
function calcWeeklySummary(weekSessions, weeklyRow) {
  var base = weeklyRow || {};
  return {
    daysLogged:        base.days_logged        || 0,
    avgCal:            base.avg_calories       || 0,
    avgProtein:        base.avg_protein        || 0,
    proteinCompliance: base.protein_compliance || 0,
    eatOutMeals:       base.eat_out_meals      || 0,
    homeMeals:         base.home_meals         || 0,
    totalMeals:        base.total_meals        || 0,
    sessions:          weekSessions.length,
    totalDifficulty:   weekSessions.reduce(function(a, s) { return a + (s.difficulty_kg || 0); }, 0),
    avgBalance:        base.avg_energy_balance || null
  };
}

// ── DASHBOARD ─────────────────────────────────────────────────
function Dashboard({ config, todayLogs, calGoal, carbGoal, fatGoal, isTrainingDay, weekSessions, weeklyRow, onTabChange, weeklySummaryLogs, activities }) {
  var totals = todayLogs.reduce(function(a, e) { return { cal: a.cal + (e.calories||e.cal||0), protein: a.protein + (e.protein||0), carbs: a.carbs + (e.carbs||0), fat: a.fat + (e.fat||0) }; }, { cal: 0, protein: 0, carbs: 0, fat: 0 });
  var remaining = calGoal - totals.cal;
  var last = weekSessions.length > 0 ? weekSessions[weekSessions.length - 1] : null;
  var weekly = calcWeeklySummary(weekSessions, weeklyRow);
  var [weeklyReport, setWeeklyReport] = useState(""); var [reportLoading, setReportLoading] = useState(false); var [reportErr, setReportErr] = useState("");
  async function handleWeeklyReport() { setReportLoading(true); setReportErr(""); try { setWeeklyReport(await generateWeeklyReport(weekly, config)); } catch(e) { setReportErr("Failed: " + e.message); } setReportLoading(false); }
  return (
    <div>
      <Card>
        <CardHdr left="Today — Nutrition" right={<span style={{ fontSize: 11, color: "#aaa" }}>{fmtDate(todayISO())}</span>} />
        <div style={{ padding: 14 }}>
          <MacroBar label="Calories" value={totals.cal} goal={calGoal} color="#a5f3fc" />
          <MacroBar label="Protein" value={totals.protein} goal={config.nutrition.protein} color="#86efac" />
          <MacroBar label="Carbs" value={totals.carbs} goal={carbGoal} color="#fde68a" />
          <MacroBar label="Fat" value={totals.fat} goal={fatGoal} color="#fca5a5" />
          <div style={{ marginTop: 10, fontSize: 13, fontWeight: 500, color: remaining >= 0 ? "#166534" : "#dc2626" }}>{remaining >= 0 ? remaining + " kcal remaining" : Math.abs(remaining) + " kcal over goal"}</div>
          <div style={{ fontSize: 11, color: "#aaa", marginTop: 4 }}>{isTrainingDay ? "Training day targets" : "Rest day targets"}</div>
        </div>
      </Card>
      <Card>
        <CardHdr left="This week" right={<span style={{ fontSize: 11, color: "#aaa" }}>{weekly.daysLogged || 0} / 7 days logged</span>} />
        <div style={{ padding: 14 }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 12 }}>
            {(function() {
              var prevWkKey = (function() {
                var parts = getWeekKey(todayISO()).split("_W");
                var yr = parseInt(parts[0]), wn = parseInt(parts[1]);
                return wn === 1 ? (yr - 1) + "_W52" : yr + "_W" + String(wn - 1).padStart(2, "0");
              })();
              var prevWeekly = weeklyRow ? null : null; // weeklyRow is current, we need prev from weeklySummaryLogs
              var eatOutPct = weekly.totalMeals > 0 ? Math.round((weekly.eatOutMeals / weekly.totalMeals) * 100) : null;
              var prevWr = weeklySummaryLogs[prevWkKey];
              var prevEatOutPct = prevWr && prevWr.total_meals > 0 ? Math.round((prevWr.eat_out_meals / prevWr.total_meals) * 100) : null;
              var eatOutColor = eatOutPct === null ? "#aaa" : prevEatOutPct === null ? "#1a1a1a" : eatOutPct <= prevEatOutPct ? "#166534" : "#dc2626";
              var activityCount = activities.filter(function(a) { var wkStart = getWeekStart(todayISO()); var wkEnd = (function() { var d = new Date(wkStart + "T12:00:00"); d.setDate(d.getDate() + 6); return d.toISOString().slice(0, 10); })(); return a.date >= wkStart && a.date <= wkEnd; }).length;
              var totalActivities = (weekly.sessions || 0) + activityCount;
              var proteinDaysHit = weekly.proteinCompliance !== null && weekly.daysLogged ? Math.round(weekly.proteinCompliance / 100 * weekly.daysLogged) : null;
              var balanceColor = !weekly.avgBalance ? "#aaa" : weekly.avgBalance < -600 ? "#dc2626" : weekly.avgBalance < 0 ? "#166534" : "#dc2626";
              return [
                { label: "Avg energy balance", value: weekly.avgBalance ? weekly.avgBalance + " kcal" : "-", color: balanceColor },
                { label: "Sessions & activities", value: totalActivities, color: "#1a1a1a" },
                { label: "Eat-out meals", value: eatOutPct !== null ? eatOutPct + "%" : "-", color: eatOutColor },
                { label: "Avg protein", value: weekly.avgProtein ? weekly.avgProtein + "g" : "-", color: "#1a1a1a" },
                { label: "Protein goal hit", value: proteinDaysHit !== null ? proteinDaysHit + " / " + weekly.daysLogged + " days" : "-", color: "#1a1a1a" },
              ].map(function(item) {
                return <div key={item.label} style={{ background: "#f5f5f3", borderRadius: 8, padding: "8px 10px", textAlign: "center" }}>
                  <div style={{ fontSize: 15, fontWeight: 500, color: item.color }}>{item.value}</div>
                  <div style={{ fontSize: 10, color: "#aaa" }}>{item.label}</div>
                </div>;
              });
            })()}
          </div>
          {weekly.daysLogged >= 3
            ? <div><ActionBtn secondary onClick={handleWeeklyReport} disabled={reportLoading}>{reportLoading ? "Generating..." : "Generate weekly report"}</ActionBtn>{reportErr && <div style={{ fontSize: 12, color: "#dc2626", marginTop: 6 }}>{reportErr}</div>}{weeklyReport && <div style={{ fontSize: 13, color: "#333", background: "#f9f9f7", borderRadius: 8, padding: 12, marginTop: 8, lineHeight: 1.6 }}>{weeklyReport}</div>}</div>
            : <div style={{ fontSize: 11, color: "#aaa", textAlign: "center" }}>Log at least 3 days to generate weekly report</div>}
        </div>
      </Card>
      <Card>
        <CardHdr left="Last session" />
        <div style={{ padding: 14 }}>
          {last
            ? <div><div style={{ fontSize: 14, fontWeight: 500, marginBottom: 4 }}>{last.title}</div><div style={{ fontSize: 12, color: "#888", marginBottom: 10 }}>{last.date}{last.actual_duration ? " · " + last.actual_duration + " min" : ""}</div><div style={{ display: "flex", gap: 12 }}>{[["difficulty kg", last.difficulty_kg || "-"], ["completion", (last.completion_pct || "-") + "%"]].map(function(item) { return <div key={item[0]} style={{ flex: 1, background: "#f5f5f3", borderRadius: 8, padding: "8px 10px", textAlign: "center" }}><div style={{ fontSize: 18, fontWeight: 500 }}>{item[1]}</div><div style={{ fontSize: 10, color: "#aaa" }}>{item[0]}</div></div>; })}</div></div>
            : <div style={{ textAlign: "center", padding: "20px 0" }}><div style={{ fontSize: 13, color: "#aaa", marginBottom: 12 }}>No sessions this week.</div><ActionBtn secondary onClick={function() { onTabChange("training"); }}>Go to Training</ActionBtn></div>}
        </div>
      </Card>
      <Card>
        <CardHdr left="Body composition" right={<span style={{ fontSize: 11, color: "#aaa" }}>{config.athlete.scanDate}</span>} />
        <div style={{ padding: 14 }}>
          {[["Weight", config.athlete.weight + " kg"], ["SMM", config.athlete.smm + " kg"], ["Body Fat", config.athlete.bf + "%"], ["Phase", config.goals.phase], ["Target", config.goals.targetWeight + " kg"]].map(function(item) { return <div key={item[0]} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "4px 0", borderBottom: "0.5px solid #f0f0f0" }}><span style={{ color: "#888" }}>{item[0]}</span><span style={{ fontWeight: 500 }}>{item[1]}</span></div>; })}
        </div>
      </Card>
    </div>
  );
}

// ── EXERCISE TIMER ────────────────────────────────────────────
var ExTimer = memo(function ExTimer({ reps }) {
  var [rem, setRem] = useState(reps); var ref = useRef(null);
  function start() { if (ref.current) clearInterval(ref.current); var r = reps; setRem(r); ref.current = setInterval(function() { r--; setRem(r); if (r <= 0) { clearInterval(ref.current); beep(); } }, 1000); }
  function reset() { if (ref.current) clearInterval(ref.current); setRem(reps); }
  useEffect(function() { return function() { if (ref.current) clearInterval(ref.current); }; }, []);
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", background: "#f9f9f7", border: "0.5px solid #eee", borderRadius: 10, padding: 14, marginBottom: 14 }}>
      <div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 6 }}>EXERCISE TIMER</div>
      <div style={{ fontSize: 56, fontWeight: 500, lineHeight: 1 }}>{fmtTime(rem)}</div>
      <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
        <button style={{ padding: "8px 20px", borderRadius: 20, border: "0.5px solid #ccc", background: "#fff", fontSize: 13, cursor: "pointer" }} onClick={start}>Start</button>
        <button style={{ padding: "8px 20px", borderRadius: 20, border: "0.5px solid #ccc", background: "#fff", fontSize: 13, cursor: "pointer" }} onClick={reset}>Reset</button>
      </div>
    </div>
  );
});

// ── SET SCREEN ────────────────────────────────────────────────
var SetScreen = memo(function SetScreen({ ex, si, log, lastRef, onLog, onSkip, onSetLog, onSetWeight, onSetRir, totalSets, allLogs }) {
  return (
    <div style={{ padding: 16 }}>
      <div style={{ fontSize: 17, fontWeight: 500, marginBottom: 2 }}>{ex.name}</div>
      <div style={{ fontSize: 12, color: "#888", marginBottom: 6 }}>{ex.equip} · {ex.tempo}</div>
      <div style={{ fontSize: 12, color: "#555", background: "#f9f9f7", borderLeft: "3px solid #ccc", padding: "7px 10px", borderRadius: "0 6px 6px 0", marginBottom: 14, lineHeight: 1.5 }}>{ex.cue}</div>
      <div style={{ display: "flex", gap: 6, marginBottom: 14, alignItems: "center" }}>
        {Array.from({ length: totalSets }, function(_, i) { var s = allLogs[i] && allLogs[i].done ? "done" : i === si ? "current" : "idle"; return <div key={i} style={{ width: s === "current" ? 12 : 10, height: s === "current" ? 12 : 10, borderRadius: "50%", background: s === "done" ? "#2d7a4f" : s === "current" ? "#1a1a1a" : "#ddd", flexShrink: 0 }} />; })}
        <span style={{ fontSize: 12, color: "#999", marginLeft: 4 }}>Set {si + 1} of {totalSets}</span>
      </div>
      <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 10, color: "#333" }}>Target: {ex.reps}{ex.ru}{ex.kg > 0 ? " · " + ex.kg + " kg" : ""}</div>
      {lastRef && <div style={{ fontSize: 11, color: "#888", background: "#f0f0ee", borderRadius: 6, padding: "5px 10px", marginBottom: 12 }}>Last: {lastRef.actual_reps || "-"} reps · {lastRef.actual_kg || "-"} kg · {lastRef.rir_score ? RIR_MAP[lastRef.rir_score] : "-"}</div>}
      {ex.ru === "sec" && <ExTimer reps={ex.reps} />}
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 14 }}>
        <div><div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 4 }}>REPS{ex.ru && ex.ru !== "sec" ? " (" + ex.ru + ")" : ""} COMPLETED</div><Stepper value={log.reps !== "" ? log.reps : String(ex.reps)} onChange={onSetLog} step={1} placeholder={String(ex.reps)} /></div>
        <div><div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 4 }}>WEIGHT (KG)</div><Stepper value={log.weight !== "" ? log.weight : (ex.kg > 0 ? String(ex.kg) : "")} onChange={onSetWeight} step={0.5} placeholder={ex.kg > 0 ? String(ex.kg) : "kg"} /></div>
      </div>

// ── REST SCREEN ───────────────────────────────────────────────
var RestScreen = memo(function RestScreen({ restRem, nextLabel, nextEx, restKey, hrInputRefs, onSkip }) {

// ── TRAINING SUMMARY ──────────────────────────────────────────
function TrainingSummary({ session, logs, wl, estDur, dur, buildCSV, syncStatus }) {
  var [showCSV, setShowCSV] = useState(false); var [copyDone, setCopyDone] = useState(false);
  var wlRows = [["Difficulty", wl.expWeighted + " kg", false], ["Completion", wl.pct + "%", "comp"], ["Est. duration", estDur + " min", "sm"]];
  if (dur) wlRows.push(["Actual duration", dur + " min", "sm"]);
  wlRows.push(["Weighted delta", (wl.actWeighted - wl.expWeighted >= 0 ? "+" : "") + (wl.actWeighted - wl.expWeighted) + " kg", "sm"]);
  wlRows.push(["BW/ISO delta", (wl.actBW - wl.expBW >= 0 ? "+" : "") + (wl.actBW - wl.expBW) + " reps", "sm"]);
  return (
    <div>
      <SyncStatus status={syncStatus} />
      <div style={{ background: "#fff", border: "0.5px solid #ddd", borderRadius: 10, padding: "12px 14px", marginBottom: 10 }}>
        <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 8 }}>Equipment needed</div>
        {session.blocks.map(function(b) { return b.exercises.map(function(ex) { return <div key={ex.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "5px 0", borderBottom: "0.5px solid #f0f0f0" }}><span>{ex.name}</span><span style={{ color: "#2d7a4f", fontWeight: 500 }}>{ex.kg > 0 ? ex.kg + " kg" : "Bodyweight"}</span></div>; }); })}
      </div>
      <div style={{ background: "#1a1a1a", color: "#fff", borderRadius: 10, padding: 14, marginBottom: 10 }}>
        <div style={{ fontSize: 12, color: "#aaa", marginBottom: 10, fontWeight: 500 }}>SESSION WORKLOAD</div>
        {wlRows.map(function(row) { var k = row[0], v = row[1], type = row[2]; var col = type === "comp" ? (wl.pct >= 90 ? "#86efac" : wl.pct >= 70 ? "#fde68a" : "#fca5a5") : type === "sm" ? "#aaa" : "#fff"; return <div key={k} style={{ display: "flex", justifyContent: "space-between", fontSize: type === "sm" ? 12 : 13, padding: "4px 0" }}><span style={{ color: type === "sm" ? "#aaa" : "#fff" }}>{k}</span><span style={{ color: col }}>{v}</span></div>; })}
      </div>
      {session.blocks.map(function(b) { return b.exercises.map(function(ex) {
        var isSec = ex.ru === "sec"; var vol = 0; var isW = false;
        return (
          <div key={ex.id} style={{ background: "#fff", border: "0.5px solid #ddd", borderRadius: 10, padding: "12px 14px", marginBottom: 10 }}>
            <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 8 }}>{ex.name}</div>
            {(logs[ex.id] || []).map(function(lg, i) { var r = parseFloat(lg.reps) || ex.reps || 0, w = parseFloat(lg.weight) || (ex.kg > 0 ? ex.kg : 0); if (w > 0) { vol += r * w; isW = true; } var below = !isSec && lg.reps && r < ex.reps; return <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "4px 0", borderBottom: "0.5px solid #f0f0f0", color: "#555" }}><span>Set {i + 1}</span><span>{isSec ? ((lg.reps || ex.reps) + "s") : ((lg.reps || ex.reps) + " reps")} · {w > 0 ? w + " kg" : "BW"} · {lg.rir ? RIR_MAP[lg.rir] : "-"}{below ? <span style={{ color: "#dc2626", fontSize: 10 }}> ↓</span> : null}</span></div>; })}
            <div style={{ fontSize: 11, color: "#888", marginTop: 6, paddingTop: 6, borderTop: "0.5px solid #f0f0f0" }}>{isW ? "Total volume: " + Math.round(vol) + " kg" : isSec ? "Isometric - duration & RIR" : "Bodyweight - reps & RIR"}</div>
          </div>
        );
      }); })}
      <ActionBtn onClick={function() { navigator.clipboard.writeText(buildCSV()).then(function() { setCopyDone(true); setTimeout(function() { setCopyDone(false); }, 2000); }).catch(function() { setShowCSV(true); }); }}>{copyDone ? "Copied" : "Copy summary"}</ActionBtn>
      <ActionBtn secondary onClick={function() { setShowCSV(function(v) { return !v; }); }}>Export as CSV</ActionBtn>
      {showCSV && <div style={{ background: "#f5f5f3", border: "0.5px solid #ddd", borderRadius: 8, padding: 12, fontSize: 11, fontFamily: "monospace", whiteSpace: "pre-wrap", wordBreak: "break-all", marginTop: 8, maxHeight: 200, overflowY: "auto" }}>{buildCSV()}</div>}
    </div>
  );
}

// ── TRAINING TAB ──────────────────────────────────────────────
function TrainingTab({ config, onSessionSaved, lastSessionSets }) {
  var [session, setSession] = useState(null); var [phase, setPhase] = useState("loader");
  var [wuChecked, setWuChecked] = useState({}); var [logs, setLogs] = useState({});
  var [trainState, setTrainState] = useState({ bk: "", ei: 0, si: 0 });
  var [resting, setResting] = useState(null); var [restRem, setRestRem] = useState(0);
  var [hrAtRest, setHrAtRest] = useState({}); var [skipConfirm, setSkipConfirm] = useState(null);
  var [syncStatus, setSyncStatus] = useState(null); var [sessionStartTime, setSessionStartTime] = useState(null);
  var [configInput, setConfigInput] = useState(""); var [configErr, setConfigErr] = useState("");
  var restRef = useRef(null); var hrInputRefs = useRef({});

  useEffect(function() { var r = localStorage.getItem("hh_active_session"); if (r) { try { applySession(JSON.parse(r), false); } catch(e) {} } }, []);
  useEffect(function() {
    if (!resting) return; if (restRef.current) clearInterval(restRef.current);
    var rem = resting.sec; setRestRem(rem);
    restRef.current = setInterval(function() { rem--; setRestRem(rem); if (rem <= 0) { clearInterval(restRef.current); captureHR(resting.restKey); beep(); doAdvance(resting.bk, resting.ei, resting.si, false); } }, 1000);
    return function() { clearInterval(restRef.current); };
  }, [resting]);

  function captureHR(rk) { var el = hrInputRefs.current[rk]; if (el && el.value && !isNaN(el.value) && parseFloat(el.value) > 0) setHrAtRest(function(h) { var n = Object.assign({}, h); n[rk] = parseFloat(el.value); return n; }); }
  function applySession(s, save) {
    setSession(s); var l = {}; s.blocks.forEach(function(b) { b.exercises.forEach(function(ex) { l[ex.id] = Array.from({ length: ex.sets }, function() { return { reps: "", weight: "", rir: null, done: false }; }); }); });
    setLogs(l); setHrAtRest({}); setSessionStartTime(null); setTrainState({ bk: s.blocks[0].id, ei: 0, si: 0 });
    if (save) localStorage.setItem("hh_active_session", JSON.stringify(s));
    setPhase("warmup");
  }
  function getBlock(bk) { return session && session.blocks.find(function(b) { return b.id === bk; }); }
  function calcDuration() { if (!session) return "?"; var total = 7; session.blocks.forEach(function(b) { var sets = 0; b.exercises.forEach(function(ex) { sets += ex.sets; }); total += Math.ceil((sets * 45 + (sets - b.exercises.length) * b.rbs + (b.exercises.length - 1) * b.rbe) / 60) + 2; }); return total; }
  function calcWorkload() {
    if (!session) return { expWeighted: 0, actWeighted: 0, expBW: 0, actBW: 0, pct: 0 };
    var eW = 0, aW = 0, eBW = 0, aBW = 0;
    session.blocks.forEach(function(b) { b.exercises.forEach(function(ex) { for (var s = 0; s < ex.sets; s++) { var lg = (logs[ex.id] && logs[ex.id][s]) || {}; if (ex.kg > 0) { eW += ex.reps * ex.kg; aW += (parseFloat(lg.reps) || ex.reps) * (parseFloat(lg.weight) || ex.kg); }
 else { eBW += ex.reps; aBW += parseFloat(lg.reps) || ex.reps; }
 } }); });
    var pct = eW > 0 ? Math.round((aW / eW) * 100) : eBW > 0 ? Math.round((aBW / eBW) * 100) : 0;
    return { expWeighted: Math.round(eW), actWeighted: Math.round(aW), expBW: Math.round(eBW), actBW: Math.round(aBW), pct: pct };
  }
  var updateLog = useCallback(function(exId, si, field, val) { setLogs(function(prev) { var next = Object.assign({}, prev); next[exId] = prev[exId].map(function(l, i) { return i === si ? Object.assign({}, l, { [field]: val }) : l; }); return next; }); }, []);

  function logSet(bk, ei, si) {
    var b = getBlock(bk), ex = b.exercises[ei];
    setLogs(function(prev) { var n = Object.assign({}, prev); n[ex.id] = prev[ex.id].map(function(l, i) { return i === si ? Object.assign({}, l, { done: true }) : l; }); return n; });
    var isLastSet = si >= ex.sets - 1, isLastEx = ei >= b.exercises.length - 1;
    var sec = isLastSet ? b.rbe : b.rbs;
    var nextLabel = !isLastSet ? "Set " + (si + 2) + " of " + ex.sets : !isLastEx ? b.exercises[ei + 1].name : "Block complete";
    var nextEx = !isLastSet ? ex : !isLastEx ? b.exercises[ei + 1] : null;
    setResting({ bk: bk, ei: ei, si: si, sec: sec, nextLabel: nextLabel, nextEx: nextEx, restKey: bk + "_" + ei + "_" + si });
  }
  function doAdvance(bk, ei, si, skipped) {
    setResting(null); setSkipConfirm(null); var b = getBlock(bk);
    if (skipped) { var ex0 = b.exercises[ei]; setLogs(function(prev) { var n = Object.assign({}, prev); n[ex0.id] = prev[ex0.id].map(function(l, i) { return i === si ? Object.assign({}, l, { done: true }) : l; }); return n; }); }
    var ex = b.exercises[ei];
    if (si < ex.sets - 1) { setTrainState({ bk: bk, ei: ei, si: si + 1 }); return; }
    if (ei < b.exercises.length - 1) { setTrainState({ bk: bk, ei: ei + 1, si: 0 }); return; }
    var bIdx = session.blocks.findIndex(function(x) { return x.id === bk; });
    if (bIdx < session.blocks.length - 1) { var nb = session.blocks[bIdx + 1].id; setPhase(nb); setTrainState({ bk: nb, ei: 0, si: 0 }); }
    else { var d = sessionStartTime ? Math.round((Date.now() - sessionStartTime) / 60000) : null; saveSession(d); setPhase("complete"); }
  }

  async function saveSession(dur) {
    var wl = calcWorkload(); var estDur = calcDuration();
    var hrs = Object.values(hrAtRest).filter(function(v) { return v > 0; });
    var avgHR = hrs.length ? Math.round(hrs.reduce(function(a, b) { return a + b; }, 0) / hrs.length) : null;
    var blockVols = {};
    session.blocks.forEach(function(b, i) {
      var key = "block_" + String.fromCharCode(97 + i) + "_volume";
      var vol = 0; b.exercises.forEach(function(ex) { (logs[ex.id] || []).forEach(function(s) { vol += (parseFloat(s.reps) || 0) * (parseFloat(s.weight) || 0); }); });
      blockVols[key] = Math.round(vol);
    });

    var sessionRow = {
      date: session.dateISO || todayISO(),
      title: session.title,
      hrv: parseInt(session.hrv) || null,
      rhr: parseInt(session.rhr) || null,
      readiness: session.readiness || null,
      est_duration: parseInt(estDur) || null,
      actual_duration: dur || null,
      difficulty_kg: wl.expWeighted,
      completion_pct: wl.pct,
      weighted_delta: wl.actWeighted - wl.expWeighted,
      bw_iso_delta: wl.actBW - wl.expBW,
      block_a_volume: blockVols.block_a_volume || null,
      block_b_volume: blockVols.block_b_volume || null,
      block_c_volume: blockVols.block_c_volume || null,
      avg_peak_hr: avgHR,
      session_json: session
    };

    try {
      var result = await supabaseQuery({ action: "insert", table: "training_sessions", data: sessionRow });
      var sessionId = Array.isArray(result) && result[0] ? result[0].id : null;

      // Insert all sets
      if (sessionId) {
        var setRows = [];
        session.blocks.forEach(function(b, bi) {
          b.exercises.forEach(function(ex, ei) {
            (logs[ex.id] || []).forEach(function(lg, si) {
              setRows.push({
                session_id: sessionId,
                date: session.dateISO || todayISO(),
                block: b.label,
                exercise: ex.name,
                set_number: si + 1,
                target_reps: ex.reps,
                target_kg: ex.kg,
                actual_reps: parseFloat(lg.reps) || ex.reps || null,
                actual_kg: parseFloat(lg.weight) || (ex.kg > 0 ? ex.kg : null),
                rir_score: lg.rir || null,
                rir_label: lg.rir ? RIR_MAP[lg.rir] : null,
                peak_hr: hrAtRest[b.id + "_" + ei + "_" + si] || null
              });
            });
          });
        });
        await supabaseQuery({ action: "insert", table: "session_sets", data: setRows });
      }

      setSyncStatus("ok");
      syncSheet();
      onSessionSaved({ ...sessionRow, id: sessionId });
    } catch(e) {
      setSyncStatus("fail");
    }
    localStorage.removeItem("hh_active_session");
  }

  function buildCSV() {
    var wl = calcWorkload(); var dur = sessionStartTime ? Math.round((Date.now() - sessionStartTime) / 60000) : "";
    var rows = [["Date","Title","HRV","RHR","Duration (min)","Difficulty (kg)","Completion (%)","Block","Exercise","Set","Target Reps","Target Kg","Actual Reps","Actual Kg","RIR Score","RIR Label","Peak HR (bpm)"]];
    session.blocks.forEach(function(b, bi) { b.exercises.forEach(function(ex, ei) { (logs[ex.id] || []).forEach(function(lg, si) { rows.push([session.date, session.title, session.hrv, session.rhr, dur, wl.expWeighted, wl.pct, b.label, ex.name, si + 1, ex.reps, ex.kg, lg.reps || "", lg.weight || "", lg.rir || "", lg.rir ? RIR_MAP[lg.rir] : "", hrAtRest[b.id + "_" + ei + "_" + si] || ""]); }); }); });
    return rows.map(function(r) { return r.map(function(c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(","); }).join("\n");
  }

  var wl = calcWorkload(), estDur = calcDuration(), dur = sessionStartTime ? Math.round((Date.now() - sessionStartTime) / 60000) : null;
  var phases = session ? ["loader", "warmup"].concat(session.blocks.map(function(b) { return b.id; })).concat(["summary"]) : ["loader"];
  var phaseLabels = { loader: "Config", warmup: "Warm-up", summary: "Summary" };
  if (session) session.blocks.forEach(function(b) { phaseLabels[b.id] = b.label.split("-")[0].trim(); });

  return (
    <div>
      {session && <div style={{ fontSize: 11, color: "#888", marginBottom: 12 }}>{session.date}</div>}
      <div style={{ display: "flex", gap: 6, marginBottom: 14, overflowX: "auto", paddingBottom: 4 }}>
        {phases.map(function(p) { return <button key={p} onClick={function() { setPhase(p); }} style={{ padding: "6px 12px", borderRadius: 20, border: "0.5px solid #ccc", background: phase === p ? "#1a1a1a" : "#fff", color: phase === p ? "#fff" : "#666", fontSize: 12, cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0 }}>{phaseLabels[p]}</button>; })}
      </div>
      {phase === "loader" && <Card><CardHdr left="Session config" /><div style={{ padding: 14 }}>{session && <div style={{ background: "#dcfce7", borderRadius: 8, padding: "8px 12px", fontSize: 12, color: "#166534", marginBottom: 12 }}>Loaded: {session.title} - {session.date}</div>}<textarea style={{ width: "100%", height: 100, padding: 10, border: "0.5px solid #ccc", borderRadius: 8, fontSize: 12, fontFamily: "monospace", resize: "vertical", marginBottom: 8 }} value={configInput} onChange={function(e) { setConfigInput(e.target.value); }} placeholder='{"title":"...","dateISO":"2026-04-04","blocks":[...]}' /><ActionBtn onClick={function() { setConfigErr(""); try { applySession(JSON.parse(configInput), true); } catch(e) { setConfigErr("Invalid JSON."); } }}>Load session</ActionBtn>{session && <ActionBtn secondary onClick={function() { setPhase("warmup"); }}>Start latest session</ActionBtn>}{configErr && <div style={{ fontSize: 12, color: "#dc2626", marginTop: 6 }}>{configErr}</div>}</div></Card>}
      {phase === "warmup" && session && <Card><CardHdr left="Warm-up" right={<span style={{ fontSize: 12, color: "#aaa" }}>Est. {estDur} min</span>} /><div>{session.warmup.map(function(w, i) { return <div key={i} style={{ padding: "10px 14px", borderBottom: i < session.warmup.length - 1 ? "0.5px solid #eee" : "none", display: "flex", justifyContent: "space-between", alignItems: "center" }}><div><div style={{ fontSize: 13, fontWeight: 500, textDecoration: wuChecked[i] ? "line-through" : "none", color: wuChecked[i] ? "#bbb" : "#1a1a1a" }}>{w.name}</div><div style={{ fontSize: 11, color: "#999", marginTop: 2 }}>{w.dur} · {w.note}</div></div><button style={{ width: 30, height: 30, borderRadius: "50%", border: "0.5px solid #ccc", background: wuChecked[i] ? "#2d7a4f" : "#fff", color: wuChecked[i] ? "#fff" : "#ccc", cursor: "pointer", fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center" }} onClick={function() { setWuChecked(function(c) { var n = Object.assign({}, c); n[i] = !c[i]; return n; }); }}>✓</button></div>; })}</div><div style={{ padding: "10px 14px" }}>{sessionStartTime ? <div style={{ fontSize: 12, color: "#2d7a4f", fontWeight: 500, textAlign: "center", padding: "8px 0" }}>⏱ Session timer running</div> : <button onClick={function() { setSessionStartTime(Date.now()); }} style={{ width: "100%", padding: 13, background: "#2d7a4f", color: "#fff", border: "none", borderRadius: 10, fontSize: 14, fontWeight: 500, cursor: "pointer" }}>Start session timer</button>}</div></Card>}
      {session && session.blocks.map(function(b) {
        if (phase !== b.id) return null;
        var bk = trainState.bk, ei = trainState.ei, si = trainState.si;
        if (resting && resting.bk === b.id) return <Card key={b.id}><CardHdr left={b.label} right={<span style={badgeStyle(b.zc)}>{b.bpm}</span>} /><RestScreen restRem={restRem} nextLabel={resting.nextLabel} nextEx={resting.nextEx} restKey={resting.restKey} hrInputRefs={hrInputRefs} onSkip={function() { captureHR(resting.restKey); clearInterval(restRef.current); doAdvance(resting.bk, resting.ei, resting.si, false); }} /></Card>;
        if (bk !== b.id) return <Card key={b.id}><CardHdr left={b.label} right={<span style={badgeStyle(b.zc)}>{b.bpm}</span>} /><div style={{ padding: 16, textAlign: "center", color: "#aaa", fontSize: 13 }}>Navigate using the tabs above.</div></Card>;
        var ex = b.exercises[ei]; var log = (logs[ex && ex.id] && logs[ex.id][si]) || {};
        // Find last set for this exercise from lastSessionSets
        var lastRef = lastSessionSets.filter(function(s) { return s.exercise === ex.name && s.set_number === si + 1; })[0] || null;
        return <Card key={b.id}><CardHdr left={b.label} right={<span style={badgeStyle(b.zc)}>{b.bpm}</span>} /><div style={{ background: "#f9f9f7", borderBottom: "0.5px solid #eee", padding: "7px 14px", fontSize: 11, color: "#666", display: "flex", alignItems: "center", gap: 6 }}>Target HR: <span style={badgeStyle(b.zc)}>{b.bpm}</span></div><SetScreen ex={ex} si={si} log={log} lastRef={lastRef} totalSets={ex.sets} allLogs={logs[ex.id] || []} onLog={function() { logSet(b.id, ei, si); }} onSkip={function() { setSkipConfirm({ bk: b.id, ei: ei, si: si }); }} onSetLog={function(v) { updateLog(ex.id, si, "reps", v); }} onSetWeight={function(v) { updateLog(ex.id, si, "weight", v); }} onSetRir={function(v) { updateLog(ex.id, si, "rir", v); }} />{skipConfirm && skipConfirm.bk === b.id && skipConfirm.ei === ei && skipConfirm.si === si && <div style={{ margin: "0 16px 16px", background: "#fff7ed", border: "0.5px solid #fcd9a0", borderRadius: 8, padding: "10px 12px", fontSize: 12, color: "#92400e", textAlign: "center" }}>Skip this set?<div style={{ display: "flex", gap: 8, marginTop: 8 }}><button style={{ flex: 1, padding: 7, borderRadius: 6, border: "0.5px solid #fcd9a0", background: "#fff", fontSize: 12, cursor: "pointer" }} onClick={function() { setSkipConfirm(null); }}>Cancel</button><button style={{ flex: 1, padding: 7, borderRadius: 6, border: "none", background: "#1a1a1a", color: "#fff", fontSize: 12, cursor: "pointer" }} onClick={function() { doAdvance(b.id, ei, si, true); }}>Yes, skip</button></div></div>}</Card>;
      })}
      {phase === "complete" && <Card><CardHdr left="Session complete" /><div style={{ padding: 16, textAlign: "center" }}><div style={{ fontSize: 40, marginBottom: 12 }}>✓</div>{dur && <div style={{ fontSize: 13, color: "#888", marginBottom: 8 }}>Duration: {dur} min</div>}<SyncStatus status={syncStatus} /><ActionBtn onClick={function() { setPhase("summary"); }}>View summary</ActionBtn></div></Card>}
      {phase === "summary" && session && <TrainingSummary session={session} logs={logs} wl={wl} estDur={estDur} dur={dur} buildCSV={buildCSV} syncStatus={syncStatus} />}
    </div>
  );
}

// ── NUTRITION TAB ─────────────────────────────────────────────
function NutritionTab({ config, todayLogs, onAddMeal, onDeleteMeal, isTrainingDay, calOverride }) {
  var [meal, setMeal] = useState("Breakfast"); var [description, setDescription] = useState("");
  var [isEatOut, setIsEatOut] = useState(false); var [restaurantType, setRestaurantType] = useState("");
  var [status, setStatus] = useState(null); var [nutTab, setNutTab] = useState("log");
  var calGoal = calOverride || (isTrainingDay ? config.nutrition.caloriesTraining : config.nutrition.caloriesRest);
  var carbGoal = isTrainingDay ? config.nutrition.carbsTraining : config.nutrition.carbsRest;
  var fatGoal = isTrainingDay ? config.nutrition.fatTraining : config.nutrition.fatRest;
var totals = todayLogs.reduce(function(a, e) { return { cal: a.cal + (e.calories||e.cal||0), protein: a.protein + (e.protein||0), carbs: a.carbs + (e.carbs||0), fat: a.fat + (e.fat||0) }; }, { cal: 0, protein: 0, carbs: 0, fat: 0 });  var remaining = calGoal - totals.cal;
var MAIN_MEALS = ["Breakfast", "Lunch", "Dinner"];
  var eatOutCount = MAIN_MEALS.filter(function(m) {
    return todayLogs.some(function(e) { return e.is_eat_out && e.meal_type === m; });
  }).length;
  var homeCount = MAIN_MEALS.filter(function(m) {
    return todayLogs.some(function(e) { return !e.is_eat_out && e.meal_type === m; });
  }).length;
  function addEntry(data) {
    onAddMeal(Object.assign({ meal_type: meal, is_eat_out: isEatOut, restaurant_type: isEatOut ? restaurantType : "", description: description }, data));
    setIsEatOut(false); setRestaurantType(""); setDescription("");
