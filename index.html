<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Gym Fra</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; font-family: system-ui, sans-serif; color: #f0ede8; }
input, select, textarea, button { font-family: inherit; }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
@keyframes spin { to { transform: rotate(360deg); } }
/* ── Chalk & Iron training theme ── */
.ci-wrap { background: #111; border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
.ci-card { background: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
.ci-hdr { background: #1c1c1c; color: #f0ede8; padding: 10px 14px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a; }
.ci-badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; background: #2a2010; color: #e8a040; border: 1px solid #4a3010; }
.ci-progress { padding: 10px 14px 12px; background: #161616; border-bottom: 1px solid #222; }
.ci-progress-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.ci-progress-lbl { font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.ci-progress-val { font-size: 10px; color: #555; font-weight: 500; }
.ci-progress-track { height: 2px; background: #252525; border-radius: 2px; margin-bottom: 10px; overflow: hidden; }
.ci-progress-track:last-child { margin-bottom: 0; }
.ci-progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
.ci-set-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid #333; background: transparent; display: inline-block; }
.ci-set-dot.done { border-color: #4caf7d; background: #0d2018; }
.ci-set-dot.current { border-color: #f0ede8; }
.ci-set-dot.idle { border-color: #333; }
.ci-tile { border: 2px solid #333; border-radius: 12px; display: flex; flex-direction: column; align-items: stretch; overflow: hidden; background: #1c1c1c; }
.ci-tile-btn { width: 100%; padding: 13px 0; border: none; background: #252525; cursor: pointer; font-size: 22px; color: #888; line-height: 1; transition: background 0.15s, color 0.15s; }
.ci-tile-mid { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 8px 10px; background: #1c1c1c; }
.ci-tile-num { font-size: 40px; font-weight: 600; color: #f0ede8; line-height: 1; text-align: center; cursor: text; min-width: 50px; }
.ci-tile-input { font-size: 40px; font-weight: 600; color: #f0ede8; line-height: 1; text-align: center; width: 100%; border: none; background: transparent; outline: none; display: none; -webkit-appearance: none; }
.ci-tile-label { font-size: 11px; color: #555; font-weight: 500; margin-top: 6px; text-align: center; text-transform: uppercase; letter-spacing: .06em; }
.ci-rir-opt { flex: 1; padding: 12px 4px; border-radius: 8px; border: 1px solid #2a2a2a; background: #1c1c1c; text-align: center; cursor: pointer; font-size: 13px; font-weight: 500; color: #666; }
.ci-rir-opt.on-4 { border-color: #4caf7d; background: #0d2018; color: #4caf7d; }
.ci-rir-opt.on-3 { border-color: #4a90d9; background: #0d1a2a; color: #4a90d9; }
.ci-rir-opt.on-2 { border-color: #e8a040; background: #2a1a00; color: #e8a040; }
.ci-rir-opt.on-1 { border-color: #e05050; background: #2a0d0d; color: #e05050; }
.ci-btn-log { width: 100%; padding: 15px; background: #e8a040; color: #111; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 10px; letter-spacing: .02em; }
.ci-btn-skip { width: 100%; padding: 8px; background: transparent; color: #444; border: 1px solid #222; border-radius: 8px; font-size: 12px; cursor: pointer; }
.ci-cue { font-size: 12px; color: #666; border-left: 3px solid #e8a040; padding: 6px 10px; margin-bottom: 6px; line-height: 1.5; }
.ci-up-next { background: #1e1e1e; border-radius: 10px; border: 1px solid #2a2a2a; padding: 12px 14px; margin-bottom: 16px; text-align: left; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, memo, useCallback } = React;

const PROXY = "https://heavy-hybrid.vercel.app/api/proxy";

// ── API ───────────────────────────────────────────────────────

// Supabase read/write through proxy
// action: "select" | "insert" | "upsert" | "delete"
// table: table name
// data: object or array (for insert/upsert)
// filters: [{ column, op, value }] — op: eq | gte | lte | gt | lt
// order: "column.asc" | "column.desc"
// limit: number
async function supabaseQuery({ action, table, data, filters, order, limit }) {
  var res = await fetch(PROXY + "?target=supabase", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, table, data, filters, order, limit })
  });
  if (!res.ok) throw new Error("Supabase error: " + res.status);
  return res.json();
}

// Trigger a full sheet rebuild from Supabase
function syncSheet() {
  fetch(PROXY + "?target=sync-sheet", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({})
  }).catch(function() {});
}

async function estimateFood(text, isEatOut, restaurantType) {
  var context = isEatOut
    ? "This is an EAT-OUT meal" + (restaurantType ? " at a " + restaurantType : "") + "."
    : "This is a HOME-COOKED meal.";
  var res = await fetch(PROXY, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514", max_tokens: 500, temperature: 0,
system: "You are a nutrition expert estimating calories and macros. Estimates must be accurate and consistent.\n\nRules:\n- HOME meals: typical Italian home portions.\n- EAT-OUT meals: restaurant portions, 20-30% larger and higher in fat than home.\n- If ambiguous, assume most common Italian interpretation.\n\nYou MUST show your reasoning as a component-by-component calorie breakdown, then sum to total. Example: '90g pasta (330) + 60g guanciale (280) + 2 eggs (140) + 40g pecorino (160) = 910 kcal'.\n\nReply ONLY with raw JSON: {\"name\":\"<english name>\",\"cal\":<int>,\"protein\":<int>,\"carbs\":<int>,\"fat\":<int>,\"reasoning\":\"<component breakdown with kcal per item and total>\"}",      messages: [{ role: "user", content: context + " " + text }]
    })
  });
  if (!res.ok) { var err = await res.json().catch(function() { return {}; }); throw new Error((err.error && err.error.message) || "HTTP " + res.status); }
  var data = await res.json();
  var block = data.content.find(function(b) { return b.type === "text"; });
  return JSON.parse((block ? block.text : "").replace(/```json|```/g, "").trim());
}

async function generateWeeklyReport(weekData, config) {
  var res = await fetch(PROXY, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514", max_tokens: 500, temperature: 0,
      system: "You are an analytical performance coach. Analyse the weekly nutrition and training data and return a concise structured report. Be direct, data-driven, no flattery. Cover: avg daily calories vs target, protein compliance, energy balance trend, eat-out vs home breakdown, training sessions, one specific recommendation for next week. Under 200 words.",
      messages: [{ role: "user", content: "Weekly data: " + JSON.stringify(weekData) + "\nTargets: cal training=" + config.nutrition.caloriesTraining + " rest=" + config.nutrition.caloriesRest + " protein=" + config.nutrition.protein + "g phase=" + config.goals.phase }]
    })
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  var data = await res.json();
  var block = data.content.find(function(b) { return b.type === "text"; });
  return block ? block.text : "";
}

// ── UTILS ─────────────────────────────────────────────────────
function todayISO() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fmtDate(iso) {
  var t = todayISO(); var y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if (iso === t) return "Today"; if (iso === y) return "Yesterday";
  return new Date(iso + "T12:00:00").toLocaleDateString("en", { weekday: "short", month: "short", day: "numeric" });
}
function fmtTime(s) { var m = Math.floor(s / 60); var sec = s % 60; return m + ":" + (sec < 10 ? "0" : "") + sec; }
function getWeekKey(iso) {
  var d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));
  var jan1 = new Date(d.getFullYear(), 0, 1);
  var week = Math.ceil(((d - jan1) / 86400000 + 1) / 7);
  return d.getFullYear() + "_W" + String(week).padStart(2, "0");
}
function getWeekStart(iso) {
  var d = new Date(iso + "T12:00:00"); var day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day); return d.toISOString().slice(0, 10);
}
function getWeekEnd(iso) {
  var d = new Date(getWeekStart(iso) + "T12:00:00");
  d.setDate(d.getDate() + 6); return d.toISOString().slice(0, 10);
}
function beep() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18, 0.36].forEach(function(t) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.6, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.12);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.13);
    });
  } catch(e) {}
}
function badgeStyle(zc) {
  var m = { z2: ["#dbeafe","#1e40af"], z3: ["#dcfce7","#166534"], z4: ["#fef9c3","#854d0e"], z5: ["#fee2e2","#991b1b"] };
  var p = m[zc] || ["#eee","#333"];
  return { fontSize: 11, padding: "3px 8px", borderRadius: 20, fontWeight: 500, background: p[0], color: p[1] };
}
function rirOptStyle(val, active) {
  var m = { 4: ["#dcfce7","#2d7a4f","#166534"], 3: ["#dbeafe","#3b82f6","#1e40af"], 2: ["#fef9c3","#ca8a04","#854d0e"], 1: ["#fee2e2","#dc2626","#991b1b"] };
  var t = m[val];
  return { flex: 1, padding: "10px 4px", borderRadius: 8, border: active ? "0.5px solid " + t[1] : "0.5px solid #ccc", background: active ? t[0] : "#fff", textAlign: "center", cursor: "pointer", color: active ? t[2] : "#1a1a1a" };
}

var MEALS = ["Breakfast", "Lunch", "Dinner", "Snack"];
var RIR_MAP = { 4: "Cruise", 3: "Comfortable", 2: "Edge", 1: "Limit" };
var RIR_LABELS = [{ val: 4, label: "Cruise", sub: "4+ left" }, { val: 3, label: "Comfortable", sub: "2-3 left" }, { val: 2, label: "Edge", sub: "1-2 left" }, { val: 1, label: "Limit", sub: "0/DNF" }];
var DEFAULT_CONFIG = {
  athlete: { name: "Gym Fra", weight: 83.5, smm: 38.1, bf: 20.7, scanDate: "March 27, 2026" },
  nutrition: { caloriesTraining: 2300, caloriesRest: 1900, protein: 170, carbsTraining: 248, carbsRest: 170, fatTraining: 70, fatRest: 60 },
  training: { hmaxBpm: 192, pixelWatchCorrection: 0.80 },
  goals: { phase: "cut", targetBf: 14, targetWeight: 77.9 }
};

// ── SHARED COMPONENTS ─────────────────────────────────────────
function Card({ children, style }) { return <div style={Object.assign({ background: "#1c1c1c", border: "1px solid #2a2a2a", borderRadius: 12, marginBottom: 12, overflow: "hidden" }, style || {})}>{children}</div>; }
function CardHdr({ left, right, color }) { return <div style={{ background: "#1c1c1c", padding: "12px 14px", fontSize: 15, fontWeight: 700, display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid #222" }}><span style={{ color: color || "#f0ede8" }}>{left}</span><span style={{ fontSize: 11, color: "#555", fontWeight: 400 }}>{right}</span></div>; }
function ActionBtn({ onClick, secondary, disabled, children, tabColor: btnColor }) { var ac = btnColor || "#e8a040"; return <button onClick={onClick} disabled={disabled} style={{ width: "100%", padding: 13, background: disabled ? "#333" : secondary ? "transparent" : ac, color: disabled ? "#666" : secondary ? ac : "#111", border: secondary ? "1px solid " + ac + "55" : "none", borderRadius: 10, fontSize: 14, fontWeight: 600, cursor: disabled ? "default" : "pointer", marginBottom: 8 }}>{children}</button>; }
function Stepper({ value, onChange, step, placeholder }) {
  var v = parseFloat(value) || 0;
  return (
    <div style={{ display: "flex", alignItems: "center", border: "1px solid #2a2a2a", borderRadius: 8, overflow: "hidden", background: "#1c1c1c", height: 48 }}>
      <button style={{ width: 48, height: 48, minWidth: 48, border: "none", background: "#252525", cursor: "pointer", fontSize: 20, color: "#888" }} onClick={function() { onChange(String(Math.max(0, Math.round((v - step) * 100) / 100))); }}>-</button>
      <input type="number" inputMode={step < 1 ? "decimal" : "numeric"} style={{ flex: 1, border: "none", textAlign: "center", fontSize: 18, fontWeight: 500, background: "#1c1c1c", color: "#f0ede8", minWidth: 0, padding: 0, height: 48 }} value={value} placeholder={placeholder} onChange={function(e) { onChange(e.target.value); }} />
      <button style={{ width: 48, height: 48, minWidth: 48, border: "none", background: "#252525", cursor: "pointer", fontSize: 20, color: "#888" }} onClick={function() { onChange(String(Math.round((v + step) * 100) / 100)); }}>+</button>
    </div>
  );
}
var MACRO_COLORS = { Calories: "#5bb8d4", Protein: "#4caf7d", Carbs: "#e8a040", Fat: "#e07060" };
function MacroBar({ label, value, goal, color }) {
  var over = value > goal; var pct = Math.min((value / goal) * 100, 100);
  var barColor = over ? "#e05050" : (MACRO_COLORS[label] || color);
  return (
    <div style={{ marginBottom: 8 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}><span style={{ fontWeight: 500, color: "#f0ede8" }}>{label}</span><span style={{ color: over ? "#e05050" : "#555" }}>{value} / {goal}{label === "Calories" ? " kcal" : "g"}</span></div>
      <div style={{ background: "#252525", borderRadius: 99, height: 7, overflow: "hidden", marginTop: 3 }}><div style={{ width: pct + "%", background: barColor, height: "100%", borderRadius: 99 }} /></div>
    </div>
  );
}
function SyncStatus({ status }) {
  if (!status) return null;
  return <div style={{ fontSize: 12, padding: "6px 10px", borderRadius: 8, background: status === "ok" ? "#0d2018" : "#2a0d0d", color: status === "ok" ? "#4caf7d" : "#e05050", marginBottom: 8 }}>{status === "ok" ? "✓ Saved" : "⚠ Save failed — will retry"}</div>;
}
function Loader() {
  return <div style={{ display: "flex", justifyContent: "center", alignItems: "center", padding: 40, flexDirection: "column", gap: 16 }}>
    <div style={{ width: 24, height: 24, border: "2px solid #333", borderTop: "2px solid #e8a040", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} />
    <div style={{ fontSize: 13, color: "#555" }}>Loading your data...</div>
  </div>;
}

// ── WEEKLY SUMMARY ────────────────────────────────────────────
function calcWeeklySummary(weekSessions, weeklyRow) {
  var base = weeklyRow || {};
  return {
    daysLogged:        base.days_logged        || 0,
    avgCal:            base.avg_calories       || 0,
    avgProtein:        base.avg_protein        || 0,
    proteinCompliance: base.protein_compliance || 0,
    eatOutMeals:       base.eat_out_meals      || 0,
    homeMeals:         base.home_meals         || 0,
    totalMeals:        base.total_meals        || 0,
    sessions:          weekSessions.length,
    totalDifficulty:   weekSessions.reduce(function(a, s) { return a + (s.difficulty_kg || 0); }, 0),
    avgBalance:        base.avg_energy_balance || null
  };
}

// ── DASHBOARD ─────────────────────────────────────────────────
function Dashboard({ config, todayLogs, calGoal, carbGoal, fatGoal, isTrainingDay, weekSessions, weeklyRow, onTabChange, weeklySummaryLogs, activities, tabColor, tabBg }) {
  var totals = todayLogs.reduce(function(a, e) { return { cal: a.cal + (e.calories||e.cal||0), protein: a.protein + (e.protein||0), carbs: a.carbs + (e.carbs||0), fat: a.fat + (e.fat||0) }; }, { cal: 0, protein: 0, carbs: 0, fat: 0 });
  var remaining = calGoal - totals.cal;
  var last = weekSessions.length > 0 ? weekSessions[weekSessions.length - 1] : null;
  var weekly = calcWeeklySummary(weekSessions, weeklyRow);
  var [weeklyReport, setWeeklyReport] = useState(""); var [reportLoading, setReportLoading] = useState(false); var [reportErr, setReportErr] = useState("");
  async function handleWeeklyReport() { setReportLoading(true); setReportErr(""); try { setWeeklyReport(await generateWeeklyReport(weekly, config)); } catch(e) { setReportErr("Failed: " + e.message); } setReportLoading(false); }
  return (
    <div>
      <Card>
        <CardHdr color={tabColor} left="Dashboard" right={<span style={{ fontSize: 11, color: "#aaa" }}>{fmtDate(todayISO())}</span>} />
        <div style={{ padding: 14 }}>
          <MacroBar label="Calories" value={totals.cal} goal={calGoal} color="#a5f3fc" />
          <MacroBar label="Protein" value={totals.protein} goal={config.nutrition.protein} color="#86efac" />
          <MacroBar label="Carbs" value={totals.carbs} goal={carbGoal} color="#fde68a" />
          <MacroBar label="Fat" value={totals.fat} goal={fatGoal} color="#fca5a5" />
          <div style={{ marginTop: 10, fontSize: 13, fontWeight: 500, color: remaining >= 0 ? tabColor : "#e05050" }}>{remaining >= 0 ? remaining + " kcal remaining" : Math.abs(remaining) + " kcal over goal"}</div>
          <div style={{ fontSize: 11, color: "#444", marginTop: 4 }} style={{ color: "#444" }}>{isTrainingDay ? "Training day targets" : "Rest day targets"}</div>
        </div>
      </Card>
      <Card>
        <CardHdr color={tabColor} left="Dashboard" right={<span style={{ fontSize: 11, color: "#444" }}>{weekly.daysLogged || 0} / 7 days logged</span>} />
        <div style={{ padding: 14 }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 12 }}>
            {(function() {
              var prevWkKey = (function() {
                var parts = getWeekKey(todayISO()).split("_W");
                var yr = parseInt(parts[0]), wn = parseInt(parts[1]);
                return wn === 1 ? (yr - 1) + "_W52" : yr + "_W" + String(wn - 1).padStart(2, "0");
              })();
              var prevWeekly = weeklyRow ? null : null; // weeklyRow is current, we need prev from weeklySummaryLogs
              var eatOutPct = weekly.totalMeals > 0 ? Math.round((weekly.eatOutMeals / weekly.totalMeals) * 100) : null;
              var prevWr = weeklySummaryLogs[prevWkKey];
              var prevEatOutPct = prevWr && prevWr.total_meals > 0 ? Math.round((prevWr.eat_out_meals / prevWr.total_meals) * 100) : null;
              var eatOutColor = eatOutPct === null ? "#aaa" : prevEatOutPct === null ? "#1a1a1a" : eatOutPct <= prevEatOutPct ? "#166534" : "#dc2626";
              var activityCount = activities.filter(function(a) { var wkStart = getWeekStart(todayISO()); var wkEnd = (function() { var d = new Date(wkStart + "T12:00:00"); d.setDate(d.getDate() + 6); return d.toISOString().slice(0, 10); })(); return a.date >= wkStart && a.date <= wkEnd; }).length;
              var totalActivities = (weekly.sessions || 0) + activityCount;
              var proteinDaysHit = weekly.proteinCompliance !== null && weekly.daysLogged ? Math.round(weekly.proteinCompliance / 100 * weekly.daysLogged) : null;
              var balanceColor = !weekly.avgBalance ? "#aaa" : weekly.avgBalance < -600 ? "#dc2626" : weekly.avgBalance < 0 ? "#166534" : "#dc2626";
              return [
                { label: "Avg energy balance", value: weekly.avgBalance ? weekly.avgBalance + " kcal" : "-", color: balanceColor },
                { label: "Sessions & activities", value: totalActivities, color: "#1a1a1a" },
                { label: "Eat-out meals", value: eatOutPct !== null ? eatOutPct + "%" : "-", color: eatOutColor },
                { label: "Avg protein", value: weekly.avgProtein ? weekly.avgProtein + "g" : "-", color: "#1a1a1a" },
                { label: "Protein goal hit", value: proteinDaysHit !== null ? proteinDaysHit + " / " + weekly.daysLogged + " days" : "-", color: "#1a1a1a" },
              ].map(function(item) {
                return <div key={item.label} style={{ background: tabBg, borderRadius: 8, padding: "8px 10px", textAlign: "center", border: "1px solid " + tabColor + "22" }}>
                  <div style={{ fontSize: 15, fontWeight: 600, color: item.color === "#1a1a1a" || item.color === "#f0ede8" ? "#f0ede8" : item.color }}>{item.value}</div>
                  <div style={{ fontSize: 10, color: "#444" }}>{item.label}</div>
                </div>;
              });
            })()}
          </div>
          {weekly.daysLogged >= 3
            ? <div><ActionBtn secondary onClick={handleWeeklyReport} disabled={reportLoading} tabColor={tabColor}>{reportLoading ? "Generating..." : "Generate weekly report"}</ActionBtn>{reportErr && <div style={{ fontSize: 12, color: "#dc2626", marginTop: 6 }}>{reportErr}</div>}{weeklyReport && <div style={{ fontSize: 13, color: "#333", background: "#f9f9f7", borderRadius: 8, padding: 12, marginTop: 8, lineHeight: 1.6 }}>{weeklyReport}</div>}</div>
            : <div style={{ fontSize: 11, color: "#444", textAlign: "center" }}>Log at least 3 days to generate weekly report</div>}
        </div>
      </Card>
      <Card>
        <CardHdr color={tabColor} left="Dashboard" />
        <div style={{ padding: 14 }}>
          {last
            ? <div><div style={{ fontSize: 14, fontWeight: 500, marginBottom: 4 }}>{last.title}</div><div style={{ fontSize: 12, color: "#888", marginBottom: 10 }}>{last.date}{last.actual_duration ? " · " + last.actual_duration + " min" : ""}</div><div style={{ display: "flex", gap: 12 }}>{[["difficulty kg", last.difficulty_kg || "-"], ["completion", (last.completion_pct || "-") + "%"]].map(function(item) { return <div key={item[0]} style={{ flex: 1, background: tabBg, borderRadius: 8, padding: "8px 10px", textAlign: "center", border: "1px solid " + tabColor + "22" }}><div style={{ fontSize: 18, fontWeight: 600, color: "#f0ede8" }}>{item[1]}</div><div style={{ fontSize: 10, color: "#444" }}>{item[0]}</div></div>; })}</div></div>

    var isCircuit = rounds > 1;
    var round = trainState.round;
    if (skipped) {
      var ex0 = b.exercises[ei];
      var globalSi0 = isCircuit ? round * ex0.sets + si : si;
      setLogs(function(prev) { var n = Object.assign({}, prev); n[ex0.id] = prev[ex0.id].map(function(l, i) { return i === globalSi0 ? Object.assign({}, l, { done: true }) : l; }); return n; });
    }
    var ex = b.exercises[ei];
    if (isCircuit) {
      if (si < ex.sets - 1) { setTrainState({ bk: bk, ei: ei, si: si + 1, round: round }); return; }
      if (ei < b.exercises.length - 1) { setTrainState({ bk: bk, ei: ei + 1, si: 0, round: round }); return; }
      if (round < rounds - 1) { setTrainState({ bk: bk, ei: 0, si: 0, round: round + 1 }); return; }
    } else {
      if (si < ex.sets - 1) { setTrainState({ bk: bk, ei: ei, si: si + 1, round: 0 }); return; }
      if (ei < b.exercises.length - 1) { setTrainState({ bk: bk, ei: ei + 1, si: 0, round: 0 }); return; }
    }
    var bIdx = session.blocks.findIndex(function(x) { return x.id === bk; });
    if (bIdx < session.blocks.length - 1) { var nb = session.blocks[bIdx + 1].id; setPhase(nb); setTrainState({ bk: nb, ei: 0, si: 0, round: 0 }); }
    else { var d = sessionStartTime ? Math.round((Date.now() - sessionStartTime) / 60000) : null; saveSession(d); setPhase("complete"); }
  }

  async function saveSession(dur) {
    var wl = calcWorkload(); var estDur = calcDuration();
    var hrs = Object.values(hrAtRest).filter(function(v) { return v > 0; });
    var avgHR = hrs.length ? Math.round(hrs.reduce(function(a, b) { return a + b; }, 0) / hrs.length) : null;
    var blockVols = {};

      actual_duration: dur || null,
      difficulty_kg: wl.expWeighted,

    try {
      var result = await supabaseQuery({ action: "insert", table: "training_sessions", data: sessionRow });
      var sessionId = Array.isArray(result) && result[0] ? result[0].id : null;

      // Insert all sets
      if (sessionId) {
        var setRows = [];
        session.blocks.forEach(function(b, bi) {
          b.exercises.forEach(function(ex, ei) {
            (logs[ex.id] || []).forEach(function(lg, si) {
              var bRounds = (b.rounds && b.rounds > 1) ? b.rounds : 1;
              var isCircuitBlock = bRounds > 1;
              var roundNum = isCircuitBlock ? Math.floor(si / ex.sets) : 0;
              var setInRound = isCircuitBlock ? si % ex.sets : si;
              setRows.push({
                session_id: sessionId,
                date: session.dateISO || todayISO(),
                block: b.label,
                exercise: ex.name,
                set_number: si + 1,
                target_reps: ex.reps,
                target_kg: ex.kg,
                actual_reps: parseFloat(lg.reps) || ex.reps || null,
                actual_kg: parseFloat(lg.weight) || (ex.kg > 0 ? ex.kg : null),
                rir_score: lg.rir || null,
                rir_label: lg.rir ? RIR_MAP[lg.rir] : null,
                peak_hr: isCircuitBlock
                  ? hrAtRest[b.id + "_r" + roundNum + "_" + ei + "_" + setInRound] || null
                  : hrAtRest[b.id + "_" + ei + "_" + si] || null
              });
            });
          });
        });
        await supabaseQuery({ action: "insert", table: "session_sets", data: setRows });
      }

      setSyncStatus("ok");
      syncSheet();
      onSessionSaved({ ...sessionRow, id: sessionId });
    } catch(e) {
      setSyncStatus("fail");
    }
    localStorage.removeItem("hh_active_session");
  }

  function buildCSV() {
    var wl = calcWorkload(); var dur = sessionStartTime ? Math.round((Date.now() - sessionStartTime) / 60000) : "";
    var rows = [["Date","Title","HRV","RHR","Duration (min)","Difficulty (kg)","Completion (%)","Block","Exercise","Set","Target Reps","Target Kg","Actual Reps","Actual Kg","RIR Score","RIR Label","Peak HR (bpm)"]];
    session.blocks.forEach(function(b, bi) { b.exercises.forEach(function(ex, ei) { (logs[ex.id] || []).forEach(function(lg, si) { rows.push([session.date, session.title, session.hrv, session.rhr, dur, wl.expWeighted, wl.pct, b.label, ex.name, si + 1, ex.reps, ex.kg, lg.reps || "", lg.weight || "", lg.rir || "", lg.rir ? RIR_MAP[lg.rir] : "", hrAtRest[b.id + "_" + ei + "_" + si] || ""]); }); }); });
    return rows.map(function(r) { return r.map(function(c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(","); }).join("\n");
  }

  var wl = calcWorkload(), estDur = calcDuration(), dur = sessionStartTime ? Math.round((Date.now() - sessionStartTime) / 60000) : null;
  var phases = session ? ["loader", "warmup"].concat(session.blocks.map(function(b) { return b.id; })).concat(["summary"]) : ["loader"];

  return (
    <div>

      </div>
      {phase === "loader" && <Card><CardHdr color={tabColor} left="Config" /><div style={{ padding: 14 }}>{session && <div style={{ background: "#0d2018", borderRadius: 8, padding: "8px 12px", fontSize: 12, color: "#4caf7d", marginBottom: 12, border: "1px solid #1a3a20" }}>Loaded: {session.title} - {session.date}</div>}<textarea style={{ width: "100%", height: 100, padding: 10, border: "1px solid #2a2a2a", borderRadius: 8, fontSize: 12, fontFamily: "monospace", resize: "vertical", marginBottom: 8, background: "#1c1c1c", color: "#f0ede8" }} value={configInput} onChange={function(e) { setConfigInput(e.target.value); }} placeholder='{"title":"...","dateISO":"2026-04-04","blocks":[...]}' /><ActionBtn onClick={function() { setConfigErr(""); try { applySession(JSON.parse(configInput), true); } catch(e) { setConfigErr("Invalid JSON."); } }}>Load session</ActionBtn>{session && <ActionBtn secondary onClick={function() { setPhase("warmup"); }}>Start latest session</ActionBtn>}{configErr && <div style={{ fontSize: 12, color: "#dc2626", marginTop: 6 }}>{configErr}</div>}</div></Card>}
      {phase === "warmup" && session && <Card><CardHdr color={tabColor} left="Warm-up" right={<span style={{ fontSize: 12, color: "#555" }}>Est. {estDur} min</span>} /><div>{session.warmup.map(function(w, i) { return <div key={i} style={{ padding: "10px 14px", borderBottom: i < session.warmup.length - 1 ? "0.5px solid #eee" : "none", display: "flex", justifyContent: "space-between", alignItems: "center" }}><div><div style={{ fontSize: 13, fontWeight: 500, textDecoration: wuChecked[i] ? "line-through" : "none", color: wuChecked[i] ? "#444" : "#f0ede8" }}>{w.name}</div><div style={{ fontSize: 11, color: "#444", marginTop: 2 }}>{w.dur} · {w.note}</div></div><button style={{ width: 30, height: 30, borderRadius: "50%", border: "0.5px solid #ccc", background: wuChecked[i] ? "#4caf7d" : "#252525", color: wuChecked[i] ? "#111" : "#333", cursor: "pointer", fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center" }} onClick={function() { setWuChecked(function(c) { var n = Object.assign({}, c); n[i] = !c[i]; return n; }); }}>✓</button></div>; })}</div><div style={{ padding: "10px 14px" }}>{sessionStartTime ? <div style={{ fontSize: 12, color: tabColor, fontWeight: 500, textAlign: "center", padding: "8px 0" }}>⏱ Session timer running</div> : <button onClick={function() { setSessionStartTime(Date.now()); }} style={{ width: "100%", padding: 13, background: tabColor, color: "#111", border: "none", borderRadius: 10, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>Start session timer</button>}</div></Card>}
      {session && session.blocks.map(function(b) {
        if (phase !== b.id) return null;

        if (resting && resting.bk === b.id) {

          var db3 = b.exercises.reduce(function(a, e) { return a + (logs[e.id] || []).filter(function(l) { return l.done; }).length; }, 0);
          var sp3 = Math.round((bIdx3 / session.blocks.length) * 100);
          var bp3 = Math.round((db3 / tb3) * 100);
          return <div key={b.id} className="ci-card">

              <div className="ci-progress-row"><span className="ci-progress-lbl">Session</span><span className="ci-progress-val">Block {bIdx3 + 1} of {session.blocks.length}</span></div>
              <div style={{ display: "flex", gap: 3, marginBottom: 10 }}>
                {session.blocks.map(function(blk, i) { return <div key={i} style={{ flex: 1, height: 2, borderRadius: 2, background: "#e8a040", opacity: i < bIdx3 ? 1 : i === bIdx3 ? 0.5 : 0.15 }} />; })}
              </div>
              <div className="ci-progress-row"><span className="ci-progress-lbl">Block</span><span className="ci-progress-val">{db3} of {tb3} sets</span></div>
              <div className="ci-progress-track" style={{ marginBottom: 0 }}><div className="ci-progress-fill" style={{ width: bp3 + "%", background: "#e8a040" }} /></div>
            </div>
            <RestScreen restRem={restRem} restTotal={resting.sec} nextLabel={resting.nextLabel} nextEx={resting.nextEx} restKey={resting.restKey} hrInputRefs={hrInputRefs} onSkip={function() { captureHR(resting.restKey); clearInterval(restRef.current); doAdvance(resting.bk, resting.ei, resting.si, false); }} />
          </div>;
        }
        if (bk !== b.id) return <div key={b.id} className="ci-card"><div className="ci-hdr"><span>{b.label}</span></div><div style={{ padding: 16, textAlign: "center", color: "#555", fontSize: 13, background: "#1c1c1c" }}>Navigate using the tabs above.</div></div>;
        var rounds = (b.rounds && b.rounds > 1) ? b.rounds : 1;
        var isCircuit = rounds > 1;
        var round = trainState.round;
        var ex = b.exercises[ei]; var log = (logs[ex && ex.id] && logs[ex.id][si]) || {};
        var globalSi = isCircuit ? round * ex.sets + si : si;

        // Session progress: blocks done / total blocks
        var bIdx2 = session.blocks.findIndex(function(x) { return x.id === b.id; });
        var sessionPct = Math.round((bIdx2 / session.blocks.length) * 100);
        // Block progress: sets done in this block
        var totalBlockSets = b.exercises.reduce(function(a, e) { var r2 = (b.rounds && b.rounds > 1) ? b.rounds : 1; return a + r2 * e.sets; }, 0);
        var doneBlockSets = b.exercises.reduce(function(a, e) { return a + (logs[e.id] || []).filter(function(l) { return l.done; }).length; }, 0);
        var blockPct = Math.round((doneBlockSets / totalBlockSets) * 100);
        // Dots
        var progressDots = isCircuit
          ? b.exercises.map(function(e, i) { var gsi = round * e.sets; var done = logs[e.id] && logs[e.id][gsi] && logs[e.id][gsi].done; var curr = i === ei; return <div key={i} className={"ci-set-dot" + (done ? " done" : curr ? " current" : " idle")} />; })
          : Array.from({ length: ex.sets }, function(_, i) { var st = (logs[ex.id] && logs[ex.id][i] && logs[ex.id][i].done) ? "done" : i === si ? "current" : "idle"; return <div key={i} className={"ci-set-dot " + st} />; });
        var logBtnLabel = isCircuit ? "Log — " + ex.name : "Log set";
        // Circuit round bar
        var circuitRoundBar = isCircuit ? null : null; // round bar now merged into ci-progress below
        // Cue toggle state — use a ref to avoid re-render issues
        return <div key={b.id} className="ci-card">

          <div className="ci-progress">
            <div className="ci-progress-row"><span className="ci-progress-lbl">Session</span><span className="ci-progress-val">Block {bIdx2 + 1} of {session.blocks.length}</span></div>
            <div style={{ display: "flex", gap: 3, marginBottom: 10 }}>{session.blocks.map(function(blk, i) { return <div key={i} style={{ flex: 1, height: 2, borderRadius: 2, background: "#e8a040", opacity: i < bIdx2 ? 1 : i === bIdx2 ? 0.5 : 0.15 }} />; })}</div>
            <div className="ci-progress-row"><span className="ci-progress-lbl">Block</span><span className="ci-progress-val">{doneBlockSets} of {totalBlockSets} sets</span></div>

            {isCircuit && <div className="ci-progress-row" style={{ marginTop: 0 }}><span className="ci-progress-lbl">Round</span><span className="ci-progress-val">{round + 1} of {rounds}</span></div>}

            {ex.ru === "sec" && <ExTimer reps={ex.reps} />}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
              <CiTile id={"reps_" + globalSi} value={circuitLog.reps !== "" ? circuitLog.reps : String(ex.reps)} label="Reps" step={1} onChange={function(v) { updateLog(ex.id, globalSi, "reps", v); }} />
              <CiTile id={"weight_" + globalSi} value={circuitLog.weight !== "" ? circuitLog.weight : (ex.kg > 0 ? String(ex.kg) : "")} label="KG" step={0.5} onChange={function(v) { updateLog(ex.id, globalSi, "weight", v); }} />
            </div>
            <div style={{ fontSize: 11, color: "#555", fontWeight: 500, marginBottom: 8, textTransform: "uppercase", letterSpacing: ".06em" }}>Effort (reserve)</div>
            <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
              {RIR_LABELS.map(function(r) { var on = circuitLog.rir === r.val; return <div key={r.val} className={"ci-rir-opt" + (on ? " on-" + r.val : "")} onClick={function() { updateLog(ex.id, globalSi, "rir", r.val); }}>{r.label}</div>; })}
            </div>
            <button className="ci-btn-log" onClick={function() { logSet(b.id, ei, si); }}>{logBtnLabel}</button>

            {skipConfirm && skipConfirm.bk === b.id && skipConfirm.ei === ei && skipConfirm.si === si && <div style={{ marginTop: 10, background: "#1e1008", border: "1px solid #4a3010", borderRadius: 8, padding: "10px 12px", fontSize: 12, color: "#e8a040", textAlign: "center" }}>Skip this set?<div style={{ display: "flex", gap: 8, marginTop: 8 }}><button style={{ flex: 1, padding: 7, borderRadius: 6, border: "1px solid #4a3010", background: "transparent", fontSize: 12, cursor: "pointer", color: "#e8a040" }} onClick={function() { setSkipConfirm(null); }}>Cancel</button><button style={{ flex: 1, padding: 7, borderRadius: 6, border: "none", background: "#e8a040", color: "#111", fontSize: 12, cursor: "pointer", fontWeight: 600 }} onClick={function() { doAdvance(b.id, ei, si, true); }}>Yes, skip</button></div></div>}
          </div>
        </div>;
      })}
      {phase === "complete" && <Card><CardHdr color={tabColor} left="Done" /><div style={{ padding: 16, textAlign: "center" }}><div style={{ fontSize: 40, marginBottom: 12, color: tabColor }}>✓</div>{dur && <div style={{ fontSize: 13, color: "#555", marginBottom: 8 }}>Duration: {dur} min</div>}<SyncStatus status={syncStatus} /><ActionBtn onClick={function() { setPhase("summary"); }}>View summary</ActionBtn></div></Card>}
      {phase === "summary" && session && <TrainingSummary session={session} logs={logs} wl={wl} estDur={estDur} dur={dur} buildCSV={buildCSV} syncStatus={syncStatus} />}
    </div>
  );
}

          {isEatOut && <div style={{ marginBottom: 12 }}><div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 4 }}>RESTAURANT TYPE (optional)</div><input value={restaurantType} onChange={function(e) { setRestaurantType(e.target.value); }} placeholder="e.g. Italian sit-down, sushi, fast food..." style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "1px solid #2a2a2a", fontSize: 14, fontFamily: "inherit", background: "#1c1c1c", color: "#f0ede8" }} /></div>}

          {status && status.type === "loading" ? <ActionBtn onClick={function() { setStatus(null); }}>Cancel</ActionBtn> : <ActionBtn disabled={!description.trim()} onClick={async function() { setStatus({ type: "loading" }); try { setStatus({ type: "preview", data: await estimateFood(description, isEatOut, restaurantType) }); } catch(e) { setStatus({ type: "error", msg: e.message }); } }}>Estimate with AI</ActionBtn>}
          {status && status.type === "loading" && <div style={{ marginTop: 10, color: "#888", fontSize: 13, textAlign: "center" }}>Analysing...</div>}

                {[["Kcal", status.data.cal],["Protein", status.data.protein],["Carbs", status.data.carbs],["Fat", status.data.fat]].map(function(item) { return <div key={item[0]} style={{ background: "#161616", borderRadius: 8, padding: "6px 4px", textAlign: "center", border: "1px solid #2a2a2a" }}><div style={{ fontWeight: 700, fontSize: 15, color: "#f0ede8" }}>{item[1]}</div><div style={{ fontSize: 10, color: "#444" }}>{item[0]}</div></div>; })}
              </div>
             <div style={{ fontSize: 12, color: "#6b7280", marginBottom: 12, background: "#f9f9f7", borderRadius: 6, padding: "6px 8px", fontFamily: "monospace" }}>{status.data.reasoning}</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button onClick={function() { setStatus(null); }} style={{ flex: 1, padding: "8px 0", background: "#e5e7eb", color: "#374151", border: "none", borderRadius: 8, fontSize: 13, cursor: "pointer" }}>Cancel</button>
                <button onClick={function() { addEntry(status.data); setStatus(null); }} style={{ flex: 2, padding: "8px 0", background: tabColor, color: "#111", border: "none", borderRadius: 8, fontWeight: 700, cursor: "pointer" }}>Add to log</button>
              </div>
            </div>
          )}
        </div></Card>
      )}
      {nutTab === "meals" && (
        <div>
          {!todayLogs.length && <div style={{ textAlign: "center", color: "#aaa", marginTop: 40, fontSize: 14 }}>Nothing logged today yet.</div>}
          {MEALS.map(function(m) {
            var entries = todayLogs.filter(function(e) { return e.meal_type === m; }); if (!entries.length) return null;
            return <div key={m} style={{ marginBottom: 14 }}><div style={{ fontWeight: 500, fontSize: 11, color: "#888", marginBottom: 6, textTransform: "uppercase", letterSpacing: 1 }}>{m}</div>{entries.map(function(e) { return <div key={e.id} style={{ background: "#1c1c1c", border: "1px solid #2a2a2a", borderRadius: 10, marginBottom: 6 }}><div style={{ padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}><div><div style={{ fontWeight: 500, fontSize: 14 }}>{e.food}{e.is_eat_out ? <span style={{ fontSize: 10, background: "#fef9c3", color: "#854d0e", borderRadius: 4, padding: "1px 5px", marginLeft: 4 }}>eat-out</span> : <span style={{ fontSize: 10, background: "#dcfce7", color: "#166534", borderRadius: 4, padding: "1px 5px", marginLeft: 4 }}>home</span>}</div><div style={{ fontSize: 12, color: "#aaa" }}>P: {e.protein}g · C: {e.carbs}g · F: {e.fat}g{e.restaurant_type ? " · " + e.restaurant_type : ""}</div></div><div style={{ display: "flex", alignItems: "center", gap: 10 }}><span style={{ fontWeight: 500 }}>{e.cal || e.calories} kcal</span><button onClick={function() { onDeleteMeal(e.id); }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 16, color: "#dc2626" }}>×</button></div></div></div>; })}</div>;
          })}
          {todayLogs.length > 0 && <div style={{ background: "#161616", border: "1px solid #2a2a2a", borderRadius: 10, padding: "10px 14px" }}><div style={{ fontWeight: 500, fontSize: 13 }}>Totals</div><div style={{ fontSize: 12, color: "#888", marginTop: 4 }}>{totals.cal} kcal · {totals.protein}g P · {totals.carbs}g C · {totals.fat}g F</div><div style={{ fontSize: 12, color: "#888", marginTop: 2 }}>{todayLogs.length} meals · {homeCount} home · {eatOutCount} eat-out</div></div>}
        </div>
      )}
    </div>
  );
}

// ── CALENDAR ──────────────────────────────────────────────────

function dayCellBg(iso, burnLogs, dailySummaryLogs, correction) {
  var burn = burnLogs[iso];
  if (!burn) return null;
  var summary = dailySummaryLogs[iso];
  if (!summary) return null;
  var corrected = Math.round(burn * correction);
  var balance = (summary.calories || 0) - corrected;
  if (balance <= -300) return { bg: "#0a2818", border: "#4caf7d", color: "#4caf7d", bold: true };
  if (balance <= 0)    return { bg: "#0a1c2a", border: "#6699cc", color: "#6699cc", bold: false };
  if (balance <= 300)  return { bg: "#2a1a00", border: "#e8a040", color: "#e8a040", bold: false };
  return { bg: "#2a0d0d", border: "#e05050", color: "#e05050", bold: true };
}

function DayDetail({ iso, burnLogs, onSaveBurn, weekSessions, activities, dailySummaryLogs, correction, config, omronLogs, onSaveOmron, tabColor, tabBg }) {
  var existing = burnLogs[iso] ? String(burnLogs[iso]) : "";

  var [weight, setWeight]           = useState(existingOmron ? String(existingOmron.bodyweight)    : "");
  var [bf, setBf]                   = useState(existingOmron ? String(existingOmron.body_fat)       : "");
  var [visceralFat, setVisceralFat] = useState(existingOmron && existingOmron.visceral_fat != null ? String(existingOmron.visceral_fat) : "");
  var [omronSaved, setOmronSaved]   = useState(false);
  useEffect(function() {
    setBurnInput(burnLogs[iso] ? String(burnLogs[iso]) : "");
    var o = omronLogs[iso] || null;
