<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Heavy Hybrid</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f5f3; font-family: system-ui, sans-serif; color: #1a1a1a; }
  input, select, textarea, button { font-family: inherit; }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, memo, useCallback } = React;

const PROXY = "https://heavy-hybrid.netlify.app/.netlify/functions/proxy";

// ── API HELPERS ───────────────────────────────────────────────
async function sheetsGet(action, extraParams) {
  var params = Object.assign({ target: "sheets", action: action }, extraParams || {});
  var qs = Object.keys(params).map(function(k) { return k + "=" + encodeURIComponent(params[k]); }).join("&");
  var res = await fetch(PROXY + "?" + qs);
  var data = await res.json();
  return data;
}
async function sheetsWrite(action, payload) {
  var res = await fetch(PROXY + "?target=sheets", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: action, data: payload })
  });
  return res.json();
}
async function estimateFood(text) {
  var res = await fetch(PROXY, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514", max_tokens: 300, temperature: 0,
      system: "You are a nutrition expert specialising in Italian and Mediterranean cuisine. Estimate calories and macros for a single standard serving of the described meal, as typically prepared in an Italian home. Be consistent — the same description should always return the same values. Reply ONLY with raw JSON: {\"name\":\"<english name>\",\"cal\":<int>,\"protein\":<int>,\"carbs\":<int>,\"fat\":<int>,\"note\":\"<one sentence in user language>\"}",
      messages: [{ role: "user", content: text }]
    })
  });
  if (!res.ok) { var err = await res.json().catch(function() { return {}; }); throw new Error((err.error && err.error.message) || "HTTP " + res.status); }
  var data = await res.json();
  var block = data.content.find(function(b) { return b.type === "text"; });
  return JSON.parse((block ? block.text : "").replace(/```json|```/g, "").trim());
}
async function generateWeeklyReport(weekData, config) {
  var res = await fetch(PROXY, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514", max_tokens: 500, temperature: 0,
      system: "You are an analytical performance coach. Analyse the weekly nutrition and training data provided and return a concise structured report. Be direct, data-driven, no flattery. Cover: avg daily calories vs target, protein compliance, energy balance trend, eat-out vs home meal breakdown, training sessions completed, one specific actionable recommendation for next week. Keep it under 200 words.",
      messages: [{ role: "user", content: "Weekly data: " + JSON.stringify(weekData) + "\nTargets: calories training=" + config.nutrition.caloriesTraining + " rest=" + config.nutrition.caloriesRest + " protein=" + config.nutrition.protein + "g phase=" + config.goals.phase }]
    })
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  var data = await res.json();
  var block = data.content.find(function(b) { return b.type === "text"; });
  return block ? block.text : "";
}

// ── UTILS ─────────────────────────────────────────────────────
function todayISO() { return new Date().toISOString().slice(0, 10); }
function fmtDate(iso) {
  var t = todayISO(); var y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if (iso === t) return "Today"; if (iso === y) return "Yesterday";
  return new Date(iso + "T12:00:00").toLocaleDateString("en", { weekday: "short", month: "short", day: "numeric" });
}
function fmtTime(s) { var m = Math.floor(s / 60); var sec = s % 60; return m + ":" + (sec < 10 ? "0" : "") + sec; }
function getWeekKey(iso) {
  var d = new Date(iso + "T12:00:00"); var jan1 = new Date(d.getFullYear(), 0, 1);
  var week = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  return d.getFullYear() + "_W" + String(week).padStart(2, "0");
}
function getWeekStart(iso) {
  var d = new Date(iso + "T12:00:00"); var day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day); return d.toISOString().slice(0, 10);
}
function beep() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18, 0.36].forEach(function(t) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.6, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.12);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.13);
    });
  } catch(e) {}
}
function badgeStyle(zc) {
  var m = { z2: ["#dbeafe","#1e40af"], z3: ["#dcfce7","#166534"], z4: ["#fef9c3","#854d0e"], z5: ["#fee2e2","#991b1b"] };
  var p = m[zc] || ["#eee","#333"];
  return { fontSize: 11, padding: "3px 8px", borderRadius: 20, fontWeight: 500, background: p[0], color: p[1] };
}
function rirOptStyle(val, active) {
  var m = { 4: ["#dcfce7","#2d7a4f","#166534"], 3: ["#dbeafe","#3b82f6","#1e40af"], 2: ["#fef9c3","#ca8a04","#854d0e"], 1: ["#fee2e2","#dc2626","#991b1b"] };
  var t = m[val];
  return { flex: 1, padding: "10px 4px", borderRadius: 8, border: active ? "0.5px solid " + t[1] : "0.5px solid #ccc", background: active ? t[0] : "#fff", textAlign: "center", cursor: "pointer", color: active ? t[2] : "#1a1a1a" };
}

var MEALS = ["Breakfast", "Lunch", "Dinner", "Snack"];
var RIR_MAP = { 4: "Cruise", 3: "Comfortable", 2: "Edge", 1: "Limit" };
var RIR_LABELS = [{ val: 4, label: "Cruise", sub: "4+ left" }, { val: 3, label: "Comfortable", sub: "2-3 left" }, { val: 2, label: "Edge", sub: "1-2 left" }, { val: 1, label: "Limit", sub: "0/DNF" }];
var DEFAULT_CONFIG = {
  athlete: { name: "Heavy Hybrid", weight: 83.5, smm: 38.1, bf: 20.7, scanDate: "March 27, 2026" },
  nutrition: { caloriesTraining: 2300, caloriesRest: 1900, protein: 170, carbsTraining: 248, carbsRest: 170, fatTraining: 70, fatRest: 60 },
  training: { hmaxBpm: 192, pixelWatchCorrection: 0.80 },
  goals: { phase: "cut", targetBf: 14, targetWeight: 77.9 }
};

// ── SHARED COMPONENTS ─────────────────────────────────────────
function Card({ children, style }) { return <div style={Object.assign({ background: "#fff", border: "0.5px solid #ddd", borderRadius: 12, marginBottom: 12, overflow: "hidden" }, style || {})}>{children}</div>; }
function CardHdr({ left, right }) { return <div style={{ background: "#1a1a1a", color: "#fff", padding: "10px 14px", fontSize: 13, fontWeight: 500, display: "flex", justifyContent: "space-between", alignItems: "center" }}><span>{left}</span><span>{right}</span></div>; }
function ActionBtn({ onClick, secondary, disabled, children }) { return <button onClick={onClick} disabled={disabled} style={{ width: "100%", padding: 13, background: disabled ? "#ccc" : secondary ? "#fff" : "#1a1a1a", color: secondary ? "#1a1a1a" : "#fff", border: secondary ? "0.5px solid #ccc" : "none", borderRadius: 10, fontSize: 14, fontWeight: 500, cursor: disabled ? "default" : "pointer", marginBottom: 8 }}>{children}</button>; }
function Stepper({ value, onChange, step, placeholder }) {
  var v = parseFloat(value) || 0;
  return (
    <div style={{ display: "flex", alignItems: "center", border: "0.5px solid #ccc", borderRadius: 8, overflow: "hidden", background: "#fff", height: 48 }}>
      <button style={{ width: 48, height: 48, minWidth: 48, border: "none", background: "#f5f5f3", cursor: "pointer", fontSize: 20, color: "#333" }} onClick={function() { onChange(String(Math.max(0, Math.round((v - step) * 100) / 100))); }}>-</button>
      <input type="number" inputMode={step < 1 ? "decimal" : "numeric"} style={{ flex: 1, border: "none", textAlign: "center", fontSize: 18, fontWeight: 500, background: "#fff", minWidth: 0, padding: 0, height: 48 }} value={value} placeholder={placeholder} onChange={function(e) { onChange(e.target.value); }} />
      <button style={{ width: 48, height: 48, minWidth: 48, border: "none", background: "#f5f5f3", cursor: "pointer", fontSize: 20, color: "#333" }} onClick={function() { onChange(String(Math.round((v + step) * 100) / 100)); }}>+</button>
    </div>
  );
}
function MacroBar({ label, value, goal, color }) {
  var over = value > goal; var pct = Math.min((value / goal) * 100, 100);
  return (
    <div style={{ marginBottom: 8 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}><span style={{ fontWeight: 500 }}>{label}</span><span style={{ color: over ? "#ef4444" : "#888" }}>{value} / {goal}{label === "Calories" ? " kcal" : "g"}</span></div>
      <div style={{ background: "#e5e7eb", borderRadius: 99, height: 8, overflow: "hidden", marginTop: 3 }}><div style={{ width: pct + "%", background: over ? "#ef4444" : color, height: "100%", borderRadius: 99 }} /></div>
    </div>
  );
}
function SheetStatus({ status }) {
  if (!status) return null;
  return <div style={{ fontSize: 12, padding: "6px 10px", borderRadius: 8, background: status === "ok" ? "#dcfce7" : "#fee2e2", color: status === "ok" ? "#166534" : "#991b1b", marginBottom: 8 }}>{status === "ok" ? "✓ Saved to sheet" : "⚠ Sheet sync failed — use CSV export"}</div>;
}
function Loader() {
  return <div style={{ display: "flex", justifyContent: "center", alignItems: "center", padding: 40 }}><div style={{ width: 24, height: 24, border: "2px solid #ddd", borderTop: "2px solid #1a1a1a", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} /><style>{"@keyframes spin{to{transform:rotate(360deg)}}"}</style></div>;
}

// ── WEEKLY SUMMARY ────────────────────────────────────────────
function calcWeeklySummary(todayLogs, weekSessions, burnLogs, config, weeklyRow) {
  var today = todayISO();
  var eatOut = todayLogs.filter(function(e) { return e.eatOut; }).length;
  var totals = todayLogs.reduce(function(a, e) { return { cal: a.cal + (e.cal||0), protein: a.protein + (e.protein||0) }; }, { cal: 0, protein: 0 });
  var base = weeklyRow || {};
  return {
    weekKey: getWeekKey(today),
    daysLogged: (base["Days Logged"] || 0),
    avgCal: (base["Avg Daily Calories"] || 0),
    avgProtein: (base["Avg Daily Protein (g)"] || 0),
    proteinCompliance: (base["Protein Compliance (%)"] || 0),
    eatOutMeals: (base["Eat-out Meals"] || 0),
    homeMeals: (base["Home Meals"] || 0),
    totalMeals: (base["Total Meals"] || 0),
    sessions: weekSessions.length,
    totalDifficulty: weekSessions.reduce(function(a, s) { return a + (parseFloat(s["Difficulty (kg)"]) || 0); }, 0),
    avgBalance: (base["Avg Energy Balance"] || null)
  };
}

// ── DASHBOARD ─────────────────────────────────────────────────
function Dashboard({ config, todayLogs, calGoal, carbGoal, fatGoal, isTrainingDay, weekSessions, burnLogs, weeklyRow, onTabChange }) {
  var totals = todayLogs.reduce(function(a, e) { return { cal: a.cal + (e.cal||0), protein: a.protein + (e.protein||0), carbs: a.carbs + (e.carbs||0), fat: a.fat + (e.fat||0) }; }, { cal: 0, protein: 0, carbs: 0, fat: 0 });
  var remaining = calGoal - totals.cal;
  var last = weekSessions.length > 0 ? weekSessions[weekSessions.length - 1] : null;
  var weekly = calcWeeklySummary(todayLogs, weekSessions, burnLogs, config, weeklyRow);
  var [weeklyReport, setWeeklyReport] = useState(""); var [reportLoading, setReportLoading] = useState(false); var [reportErr, setReportErr] = useState("");
  async function handleWeeklyReport() { setReportLoading(true); setReportErr(""); try { var r = await generateWeeklyReport(weekly, config); setWeeklyReport(r); } catch(e) { setReportErr("Failed: " + e.message); } setReportLoading(false); }
  return (
    <div>
      <Card>
        <CardHdr left="Today - Nutrition" right={<span style={{ fontSize: 11, color: "#aaa" }}>{fmtDate(todayISO())}</span>} />
        <div style={{ padding: 14 }}>
          <MacroBar label="Calories" value={totals.cal} goal={calGoal} color="#a5f3fc" />
          <MacroBar label="Protein" value={totals.protein} goal={config.nutrition.protein} color="#86efac" />
          <MacroBar label="Carbs" value={totals.carbs} goal={carbGoal} color="#fde68a" />
          <MacroBar label="Fat" value={totals.fat} goal={fatGoal} color="#fca5a5" />
          <div style={{ marginTop: 10, fontSize: 13, fontWeight: 500, color: remaining >= 0 ? "#166534" : "#dc2626" }}>{remaining >= 0 ? remaining + " kcal remaining" : Math.abs(remaining) + " kcal over goal"}</div>
          <div style={{ fontSize: 11, color: "#aaa", marginTop: 4 }}>{isTrainingDay ? "Training day targets" : "Rest day targets"}</div>
        </div>
      </Card>
      <Card>
        <CardHdr left="This week" />
        <div style={{ padding: 14 }}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 12 }}>
            {[["Sessions", weekly.sessions], ["Meals logged", weekly.totalMeals || todayLogs.length], ["Eat-out", weekly.eatOutMeals]].map(function(item) { return <div key={item[0]} style={{ background: "#f5f5f3", borderRadius: 8, padding: "8px 10px", textAlign: "center" }}><div style={{ fontSize: 20, fontWeight: 500 }}>{item[1]}</div><div style={{ fontSize: 10, color: "#aaa" }}>{item[0]}</div></div>; })}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 12 }}>
            {[["Avg calories", weekly.avgCal ? weekly.avgCal + " kcal" : "-"], ["Avg protein", weekly.avgProtein ? weekly.avgProtein + "g" : "-"], ["Protein target", weekly.proteinCompliance ? weekly.proteinCompliance + "%" : "-"], ["Days logged", (weekly.daysLogged || "-") + " / 7"]].map(function(item) { return <div key={item[0]} style={{ background: "#f5f5f3", borderRadius: 8, padding: "8px 10px", textAlign: "center" }}><div style={{ fontSize: 15, fontWeight: 500 }}>{item[1]}</div><div style={{ fontSize: 10, color: "#aaa" }}>{item[0]}</div></div>; })}
          </div>
          {weekly.daysLogged >= 3 ? (
            <div>
              <ActionBtn secondary onClick={handleWeeklyReport} disabled={reportLoading}>{reportLoading ? "Generating..." : "Generate weekly report"}</ActionBtn>
              {reportErr && <div style={{ fontSize: 12, color: "#dc2626", marginTop: 6 }}>{reportErr}</div>}
              {weeklyReport && <div style={{ fontSize: 13, color: "#333", background: "#f9f9f7", borderRadius: 8, padding: 12, marginTop: 8, lineHeight: 1.6 }}>{weeklyReport}</div>}
            </div>
          ) : <div style={{ fontSize: 11, color: "#aaa", textAlign: "center" }}>Log at least 3 days to generate weekly report</div>}
        </div>
      </Card>
      <Card>
        <CardHdr left="Last session" />
        <div style={{ padding: 14 }}>
          {last ? (
            <div>
              <div style={{ fontSize: 14, fontWeight: 500, marginBottom: 4 }}>{last["Session Title"] || last.title}</div>
              <div style={{ fontSize: 12, color: "#888", marginBottom: 10 }}>{last["Date"] || last.date}{last["Actual Duration (min)"] ? " · " + last["Actual Duration (min)"] + " min" : ""}</div>
              <div style={{ display: "flex", gap: 12 }}>
                {[["difficulty kg", last["Difficulty (kg)"] || last.difficulty || "-"], ["completion", (last["Completion (%)"] || last.completion || "-") + "%"]].map(function(item) { return <div key={item[0]} style={{ flex: 1, background: "#f5f5f3", borderRadius: 8, padding: "8px 10px", textAlign: "center" }}><div style={{ fontSize: 18, fontWeight: 500 }}>{item[1]}</div><div style={{ fontSize: 10, color: "#aaa" }}>{item[0]}</div></div>; })}
              </div>
            </div>
          ) : <div style={{ textAlign: "center", padding: "20px 0" }}><div style={{ fontSize: 13, color: "#aaa", marginBottom: 12 }}>No sessions this week.</div><ActionBtn secondary onClick={function() { onTabChange("training"); }}>Go to Training</ActionBtn></div>}
        </div>
      </Card>
      <Card>
        <CardHdr left="Body composition" right={<span style={{ fontSize: 11, color: "#aaa" }}>{config.athlete.scanDate}</span>} />
        <div style={{ padding: 14 }}>
          {[["Weight", config.athlete.weight + " kg"], ["SMM", config.athlete.smm + " kg"], ["Body Fat", config.athlete.bf + "%"], ["Phase", config.goals.phase], ["Target", config.goals.targetWeight + " kg"]].map(function(item) { return <div key={item[0]} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "4px 0", borderBottom: "0.5px solid #f0f0f0" }}><span style={{ color: "#888" }}>{item[0]}</span><span style={{ fontWeight: 500 }}>{item[1]}</span></div>; })}
        </div>
      </Card>
    </div>
  );
}

// ── EXERCISE TIMER ────────────────────────────────────────────
var ExTimer = memo(function ExTimer({ reps }) {
  var [rem, setRem] = useState(reps); var ref = useRef(null);
  function start() { if (ref.current) clearInterval(ref.current); var r = reps; setRem(r); ref.current = setInterval(function() { r--; setRem(r); if (r <= 0) { clearInterval(ref.current); beep(); } }, 1000); }
  function reset() { if (ref.current) clearInterval(ref.current); setRem(reps); }
  useEffect(function() { return function() { if (ref.current) clearInterval(ref.current); }; }, []);
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", background: "#f9f9f7", border: "0.5px solid #eee", borderRadius: 10, padding: 14, marginBottom: 14 }}>
      <div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 6 }}>EXERCISE TIMER</div>
      <div style={{ fontSize: 56, fontWeight: 500, lineHeight: 1 }}>{fmtTime(rem)}</div>
      <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
        <button style={{ padding: "8px 20px", borderRadius: 20, border: "0.5px solid #ccc", background: "#fff", fontSize: 13, cursor: "pointer" }} onClick={start}>Start</button>
        <button style={{ padding: "8px 20px", borderRadius: 20, border: "0.5px solid #ccc", background: "#fff", fontSize: 13, cursor: "pointer" }} onClick={reset}>Reset</button>
      </div>
    </div>
  );
});

// ── SET SCREEN ────────────────────────────────────────────────
var SetScreen = memo(function SetScreen({ ex, si, log, lastRef, onLog, onSkip, onSetLog, onSetWeight, onSetRir, totalSets, allLogs }) {
  return (
    <div style={{ padding: 16 }}>
      <div style={{ fontSize: 17, fontWeight: 500, marginBottom: 2 }}>{ex.name}</div>
      <div style={{ fontSize: 12, color: "#888", marginBottom: 6 }}>{ex.equip} · {ex.tempo}</div>
      <div style={{ fontSize: 12, color: "#555", background: "#f9f9f7", borderLeft: "3px solid #ccc", padding: "7px 10px", borderRadius: "0 6px 6px 0", marginBottom: 14, lineHeight: 1.5 }}>{ex.cue}</div>
      <div style={{ display: "flex", gap: 6, marginBottom: 14, alignItems: "center" }}>
        {Array.from({ length: totalSets }, function(_, i) { var state = allLogs[i] && allLogs[i].done ? "done" : i === si ? "current" : "idle"; return <div key={i} style={{ width: state === "current" ? 12 : 10, height: state === "current" ? 12 : 10, borderRadius: "50%", background: state === "done" ? "#2d7a4f" : state === "current" ? "#1a1a1a" : "#ddd", flexShrink: 0 }} />; })}
        <span style={{ fontSize: 12, color: "#999", marginLeft: 4 }}>Set {si + 1} of {totalSets}</span>
      </div>
      <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 10, color: "#333" }}>Target: {ex.reps}{ex.ru}{ex.kg > 0 ? " · " + ex.kg + " kg" : ""}</div>
      {lastRef && <div style={{ fontSize: 11, color: "#888", background: "#f0f0ee", borderRadius: 6, padding: "5px 10px", marginBottom: 12 }}>Last: {lastRef.reps || "-"} reps · {lastRef.weight || "-"} kg · {lastRef.rir ? RIR_MAP[lastRef.rir] : "-"}</div>}
      {ex.ru === "sec" && <ExTimer reps={ex.reps} />}
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 14 }}>
        <div><div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 4 }}>REPS{ex.ru && ex.ru !== "sec" ? " (" + ex.ru + ")" : ""} COMPLETED</div><Stepper value={log.reps !== "" ? log.reps : String(ex.reps)} onChange={onSetLog} step={1} placeholder={String(ex.reps)} /></div>
        <div><div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 4 }}>WEIGHT (KG)</div><Stepper value={log.weight !== "" ? log.weight : (ex.kg > 0 ? String(ex.kg) : "")} onChange={onSetWeight} step={0.5} placeholder={ex.kg > 0 ? String(ex.kg) : "kg"} /></div>
      </div>
      <div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 8 }}>EFFORT (RESERVE)</div>
      <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
        {RIR_LABELS.map(function(r) { return <div key={r.val} style={rirOptStyle(r.val, log.rir === r.val)} onClick={function() { onSetRir(r.val); }}><div style={{ fontSize: 12, fontWeight: 500 }}>{r.label}</div><div style={{ fontSize: 9, color: log.rir === r.val ? "inherit" : "#999", marginTop: 2 }}>{r.sub}</div></div>; })}
      </div>
      <button style={{ width: "100%", padding: 13, background: "#1a1a1a", color: "#fff", border: "none", borderRadius: 10, fontSize: 15, fontWeight: 500, cursor: "pointer", marginBottom: 10 }} onClick={onLog}>Log set {si + 1}</button>
      <button style={{ width: "100%", padding: 7, background: "#fff", color: "#aaa", border: "0.5px solid #e0e0e0", borderRadius: 8, fontSize: 12, cursor: "pointer" }} onClick={onSkip}>Skip set</button>
    </div>
  );
});

// ── REST SCREEN ───────────────────────────────────────────────
var RestScreen = memo(function RestScreen({ restRem, nextLabel, nextEx, restKey, hrInputRefs, onSkip }) {
  return (
    <div style={{ padding: "24px 14px", textAlign: "center" }}>
      <div style={{ fontSize: 13, color: "#888", marginBottom: 8 }}>Rest</div>
      <div style={{ fontSize: 64, fontWeight: 500, marginBottom: 4, color: "#1a1a1a" }}>{fmtTime(restRem)}</div>
      <div style={{ fontSize: 12, color: "#aaa", marginBottom: 12 }}>{nextLabel} up next</div>
      {nextEx && <div style={{ background: "#f5f5f3", borderRadius: 10, padding: "12px 14px", marginBottom: 16, textAlign: "left" }}><div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 4 }}>UP NEXT</div><div style={{ fontSize: 15, fontWeight: 500, marginBottom: 2 }}>{nextEx.name}</div><div style={{ fontSize: 13, color: "#2d7a4f", fontWeight: 500 }}>{nextEx.kg > 0 ? nextEx.kg + " kg" : "Bodyweight"}{nextEx.ru ? " " + nextEx.ru : ""}</div></div>}

  var eatOutCount = todayLogs.filter(function(e) { return e.eatOut; }).length;
  var homeCount = todayLogs.filter(function(e) { return !e.eatOut; }).length;
  function addEntry(data) {
    onAddMeal(Object.assign({ id: Date.now(), meal: meal, eatOut: isEatOut, restaurantType: isEatOut ? restaurantType : "", description: description }, data));
    setIsEatOut(false); setRestaurantType(""); setDescription("");
  }
  function saveMeal(data) { try { var r = localStorage.getItem("hh_saved_meals"); var existing = r ? JSON.parse(r) : []; existing.push(Object.assign({ id: Date.now() }, data)); localStorage.setItem("hh_saved_meals", JSON.stringify(existing)); } catch(e) {} }
  return (
    <div>
      <Card>
        <CardHdr left="Nutrition - Today" right={<span style={{ fontSize: 11, color: "#aaa" }}>{calOverride ? "Override" : isTrainingDay ? "Training" : "Rest"} day</span>} />
        <div style={{ padding: 14 }}>
          <MacroBar label="Calories" value={totals.cal} goal={calGoal} color="#a5f3fc" />
          <MacroBar label="Protein" value={totals.protein} goal={config.nutrition.protein} color="#86efac" />
          <MacroBar label="Carbs" value={totals.carbs} goal={carbGoal} color="#fde68a" />
          <MacroBar label="Fat" value={totals.fat} goal={fatGoal} color="#fca5a5" />
          <div style={{ marginTop: 8, fontSize: 13, fontWeight: 500, color: remaining >= 0 ? "#166534" : "#dc2626" }}>{remaining >= 0 ? remaining + " kcal remaining" : Math.abs(remaining) + " kcal over goal"}</div>
          <div style={{ marginTop: 8, display: "flex", gap: 10 }}>
            {[["Meals", todayLogs.length], ["Home", homeCount], ["Eat-out", eatOutCount]].map(function(item) { return <div key={item[0]} style={{ flex: 1, background: "#f5f5f3", borderRadius: 8, padding: "5px 8px", textAlign: "center" }}><div style={{ fontSize: 15, fontWeight: 500 }}>{item[1]}</div><div style={{ fontSize: 10, color: "#aaa" }}>{item[0]}</div></div>; })}
          </div>
        </div>
      </Card>
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        {[["log","Log Food"],["saved","Saved"],["meals","Meals"]].map(function(item) { return <button key={item[0]} onClick={function() { setNutTab(item[0]); }} style={{ flex: 1, padding: "8px 0", borderRadius: 10, border: "0.5px solid #ccc", cursor: "pointer", fontWeight: 500, fontSize: 13, background: nutTab === item[0] ? "#1a1a1a" : "#fff", color: nutTab === item[0] ? "#fff" : "#666" }}>{item[1]}</button>; })}
      </div>
      {nutTab === "saved" && <Card><CardHdr left="Saved meals" /><div style={{ padding: 14 }}><SavedMeals onSelect={function(m) { addEntry({ food: m.food, cal: m.cal, protein: m.protein, carbs: m.carbs, fat: m.fat }); }} /></div></Card>}
      {nutTab === "log" && (
        <Card><div style={{ padding: 14 }}>
          <div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 4 }}>MEAL</div>
          <select value={meal} onChange={function(e) { setMeal(e.target.value); }} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "0.5px solid #ccc", margin: "4px 0 12px", fontSize: 14 }}>{MEALS.map(function(m) { return <option key={m}>{m}</option>; })}</select>
          <div style={{ display: "flex", gap: 8, marginBottom: 12, alignItems: "center" }}>
            <div style={{ fontSize: 13, fontWeight: 500, flex: 1 }}>Meal type</div>
            <div style={{ display: "flex", background: "#f0f0ee", borderRadius: 8, padding: 2 }}>
              {[["Home", false], ["Eat-out", true]].map(function(item) { return <button key={item[0]} onClick={function() { setIsEatOut(item[1]); if (!item[1]) setRestaurantType(""); }} style={{ padding: "6px 14px", borderRadius: 6, border: "none", background: isEatOut === item[1] ? "#1a1a1a" : "transparent", color: isEatOut === item[1] ? "#fff" : "#666", fontSize: 13, fontWeight: 500, cursor: "pointer" }}>{item[0]}</button>; })}
            </div>
          </div>
          {isEatOut && <div style={{ marginBottom: 12 }}><div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 4 }}>RESTAURANT TYPE (optional)</div><input value={restaurantType} onChange={function(e) { setRestaurantType(e.target.value); }} placeholder="e.g. Italian sit-down, sushi, fast food..." style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "0.5px solid #ccc", fontSize: 14, fontFamily: "inherit" }} /></div>}
          <div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 4 }}>DESCRIBE WHAT YOU ATE</div>
          <textarea value={description} onChange={function(e) { setDescription(e.target.value); }} placeholder="e.g. spaghetti al pomodoro con parmigiano..." rows={3} style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: "0.5px solid #ccc", margin: "4px 0 12px", fontSize: 14, resize: "vertical", fontFamily: "inherit" }} />
          {status && status.type === "loading" ? <ActionBtn onClick={function() { setStatus(null); }}>Cancel</ActionBtn> : <ActionBtn disabled={!description.trim()} onClick={async function() { setStatus({ type: "loading" }); try { setStatus({ type: "preview", data: await estimateFood(description) }); } catch(e) { setStatus({ type: "error", msg: e.message }); } }}>Estimate with AI</ActionBtn>}
          {status && status.type === "loading" && <div style={{ marginTop: 10, color: "#888", fontSize: 13, textAlign: "center" }}>Analysing...</div>}
          {status && status.type === "error" && <div style={{ marginTop: 10, color: "#dc2626", fontSize: 13 }}>Error: {status.msg}</div>}
          {status && status.type === "preview" && (
            <div style={{ marginTop: 14, background: "#f0fdf4", border: "0.5px solid #bbf7d0", borderRadius: 10, padding: 14 }}>
              <div style={{ fontWeight: 500, fontSize: 15, marginBottom: 4 }}>{status.data.name}</div>
              <div style={{ fontSize: 11, color: "#888", marginBottom: 8 }}>{isEatOut ? "Eat-out" : "Home"}{restaurantType ? " · " + restaurantType : ""}</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 6, marginBottom: 10 }}>
                {[["Kcal", status.data.cal],["Protein", status.data.protein],["Carbs", status.data.carbs],["Fat", status.data.fat]].map(function(item) { return <div key={item[0]} style={{ background: "#fff", borderRadius: 8, padding: "6px 4px", textAlign: "center" }}><div style={{ fontWeight: 700, fontSize: 15 }}>{item[1]}</div><div style={{ fontSize: 10, color: "#9ca3af" }}>{item[0]}</div></div>; })}
              </div>
              <div style={{ fontSize: 12, color: "#6b7280", fontStyle: "italic", marginBottom: 12 }}>{status.data.note}</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button onClick={function() { setStatus(null); }} style={{ flex: 1, padding: "8px 0", background: "#e5e7eb", color: "#374151", border: "none", borderRadius: 8, fontSize: 13, cursor: "pointer" }}>Cancel</button>
                <button onClick={function() { saveMeal(status.data); }} style={{ flex: 1, padding: "8px 0", background: "#dbeafe", color: "#1e40af", border: "none", borderRadius: 8, fontSize: 13, cursor: "pointer" }}>Save meal</button>
                <button onClick={function() { addEntry(status.data); setStatus(null); }} style={{ flex: 2, padding: "8px 0", background: "#2d7a4f", color: "#fff", border: "none", borderRadius: 8, fontWeight: 500, cursor: "pointer" }}>Add to log</button>
              </div>
            </div>
          )}
        </div></Card>
      )}
      {nutTab === "meals" && (
        <div>
          {!todayLogs.length && <div style={{ textAlign: "center", color: "#aaa", marginTop: 40, fontSize: 14 }}>Nothing logged today yet.</div>}
          {MEALS.map(function(m) {
            var entries = todayLogs.filter(function(e) { return e.meal === m; }); if (!entries.length) return null;
            return <div key={m} style={{ marginBottom: 14 }}><div style={{ fontWeight: 500, fontSize: 11, color: "#888", marginBottom: 6, textTransform: "uppercase", letterSpacing: 1 }}>{m}</div>{entries.map(function(e) { return <div key={e.id} style={{ background: "#fff", border: "0.5px solid #ddd", borderRadius: 10, marginBottom: 6 }}><div style={{ padding: "10px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}><div><div style={{ fontWeight: 500, fontSize: 14 }}>{e.food} {e.eatOut ? <span style={{ fontSize: 10, background: "#fef9c3", color: "#854d0e", borderRadius: 4, padding: "1px 5px", marginLeft: 4 }}>eat-out</span> : <span style={{ fontSize: 10, background: "#dcfce7", color: "#166534", borderRadius: 4, padding: "1px 5px", marginLeft: 4 }}>home</span>}</div><div style={{ fontSize: 12, color: "#aaa" }}>P: {e.protein}g · C: {e.carbs}g · F: {e.fat}g{e.restaurantType ? " · " + e.restaurantType : ""}</div></div><div style={{ display: "flex", alignItems: "center", gap: 10 }}><span style={{ fontWeight: 500 }}>{e.cal} kcal</span><button onClick={function() { onDeleteMeal(e.id); }} style={{ background: "none", border: "none", cursor: "pointer", fontSize: 16, color: "#dc2626" }}>×</button></div></div></div>; })}</div>;
          })}
          {todayLogs.length > 0 && <div style={{ background: "#f5f5f3", border: "0.5px solid #ddd", borderRadius: 10, padding: "10px 14px" }}><div style={{ fontWeight: 500, fontSize: 13 }}>Totals</div><div style={{ fontSize: 12, color: "#888", marginTop: 4 }}>{totals.cal} kcal · {totals.protein}g P · {totals.carbs}g C · {totals.fat}g F</div><div style={{ fontSize: 12, color: "#888", marginTop: 2 }}>{todayLogs.length} meals · {homeCount} home · {eatOutCount} eat-out</div></div>}
        </div>
      )}
    </div>
  );
}

// ── CALENDAR ──────────────────────────────────────────────────
function DayDetail({ iso, config, burnLogs, onSaveBurn, trainHistory, correction }) {
  var [burnInput, setBurnInput] = useState(burnLogs[iso] ? String(burnLogs[iso]) : ""); var [saved, setSaved] = useState(false);
  var burn = burnLogs[iso]; var correctedBurn = burn ? Math.round(burn * correction) : null;
  var session = trainHistory.find(function(s) { try { return s.dateISO === iso || s["Date"] === iso; } catch(e) { return false; } });
  function saveBurn() {
    var v = parseFloat(burnInput); if (!v || isNaN(v)) return;
    onSaveBurn(iso, v);
    setSaved(true); setTimeout(function() { setSaved(false); }, 2000);
  }
  var label = new Date(iso + "T12:00:00").toLocaleDateString("en", { weekday: "long", month: "long", day: "numeric" });
  return (
    <div style={{ marginTop: 14, background: "#fff", border: "0.5px solid #ddd", borderRadius: 12, overflow: "hidden" }}>
      <div style={{ background: "#1a1a1a", color: "#fff", padding: "10px 14px", fontSize: 13, fontWeight: 500, display: "flex", justifyContent: "space-between", alignItems: "center" }}><span>{label}</span><span style={{ fontSize: 11, color: "#aaa" }}>{session ? "Training day" : "Rest day"}</span></div>
      <div style={{ padding: 14 }}>
        {session && <div style={{ background: "#f5f5f3", borderRadius: 8, padding: "10px 12px", marginBottom: 14 }}><div style={{ fontSize: 12, fontWeight: 500, marginBottom: 6 }}>{session["Session Title"] || session.title}</div><div style={{ display: "flex", gap: 10 }}>{[["difficulty", (session["Difficulty (kg)"] || session.difficulty || "-") + " kg"], ["completion", (session["Completion (%)"] || session.completion || "-") + "%"]].map(function(item) { return <div key={item[0]} style={{ flex: 1, textAlign: "center" }}><div style={{ fontSize: 16, fontWeight: 500 }}>{item[1]}</div><div style={{ fontSize: 10, color: "#aaa" }}>{item[0]}</div></div>; })}</div></div>}
        <div><div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 6 }}>CALORIES BURNED (PIXEL WATCH - RAW)</div><div style={{ display: "flex", gap: 8, alignItems: "center" }}><input type="number" inputMode="numeric" value={burnInput} onChange={function(e) { setBurnInput(e.target.value); setSaved(false); }} placeholder="e.g. 2680" style={{ flex: 1, padding: "10px 12px", border: "0.5px solid #ccc", borderRadius: 8, fontSize: 15, fontWeight: 500 }} /><button onClick={saveBurn} style={{ padding: "10px 18px", background: "#1a1a1a", color: "#fff", border: "none", borderRadius: 8, fontSize: 13, fontWeight: 500, cursor: "pointer" }}>{saved ? "Saved" : "Save"}</button></div>{correctedBurn && <div style={{ marginTop: 10, fontSize: 12, color: "#888" }}>Corrected: <strong>{correctedBurn} kcal</strong> (×{correction})</div>}</div>
      </div>
    </div>
  );
}

function WeekDetail({ weekKey, omronData, onSaveOmron }) {
  var [weight, setWeight] = useState(omronData ? String(omronData.weight) : ""); var [bf, setBf] = useState(omronData ? String(omronData.bf) : ""); var [saved, setSaved] = useState(false);
  var leanMass = weight && bf ? Math.round(parseFloat(weight) * (1 - parseFloat(bf) / 100) * 10) / 10 : null;
  var fatMass = weight && bf ? Math.round(parseFloat(weight) * (parseFloat(bf) / 100) * 10) / 10 : null;
  function save() { var w = parseFloat(weight), b = parseFloat(bf); if (!w || !b || isNaN(w) || isNaN(b)) return; onSaveOmron(weekKey, w, b); setSaved(true); setTimeout(function() { setSaved(false); }, 2000); }
  return (
    <div style={{ background: "#fff", border: "0.5px solid #ddd", borderTop: "none", borderRadius: "0 0 10px 10px", padding: 14, marginBottom: 8 }}>
      <div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 12 }}>OMRON WEEKLY AVERAGE</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 14 }}>
        <div><div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 4 }}>BODYWEIGHT (KG)</div><Stepper value={weight} onChange={function(v) { setWeight(v); setSaved(false); }} step={0.1} placeholder="kg" /></div>
        <div><div style={{ fontSize: 11, color: "#999", fontWeight: 500, marginBottom: 4 }}>BODY FAT (%)</div><Stepper value={bf} onChange={function(v) { setBf(v); setSaved(false); }} step={0.1} placeholder="%" /></div>
      </div>
      {leanMass && fatMass && <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>{[["Lean mass", leanMass + " kg"], ["Fat mass", fatMass + " kg"]].map(function(item) { return <div key={item[0]} style={{ flex: 1, background: "#f5f5f3", borderRadius: 8, padding: "8px 10px", textAlign: "center" }}><div style={{ fontSize: 16, fontWeight: 500 }}>{item[1]}</div><div style={{ fontSize: 10, color: "#aaa" }}>{item[0]}</div></div>; })}</div>}
      <button onClick={save} style={{ width: "100%", padding: 13, background: saved ? "#2d7a4f" : "#1a1a1a", color: "#fff", border: "none", borderRadius: 10, fontSize: 14, fontWeight: 500, cursor: "pointer" }}>{saved ? "Saved" : "Save Omron reading"}</button>
    </div>
  );
}

function CalendarTab({ config, burnLogs, onSaveBurn, trainHistory, omronLogs, onSaveOmron }) {
  var [viewDate, setViewDate] = useState(new Date()); var [calView, setCalView] = useState("daily");
  var [selectedISO, setSelectedISO] = useState(null); var [selectedWeek, setSelectedWeek] = useState(null);
  var year = viewDate.getFullYear(), month = viewDate.getMonth();
  var daysInMonth = new Date(year, month + 1, 0).getDate();
  var firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
  var correction = config.training.pixelWatchCorrection; var today = todayISO();

  function getWeeksInMonth() { var weeks = []; for (var d = 1; d <= daysInMonth; d++) { var iso = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0"); var wk = getWeekKey(iso); if (!weeks.find(function(w) { return w.key === wk; })) { var start = new Date(iso + "T12:00:00"); var end = new Date(start); end.setDate(start.getDate() + 6); weeks.push({ key: wk, label: start.toLocaleDateString("en", { month: "short", day: "numeric" }) + " – " + end.toLocaleDateString("en", { month: "short", day: "numeric" }) }); } } return weeks; }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <button onClick={function() { setViewDate(new Date(year, month - 1, 1)); setSelectedISO(null); setSelectedWeek(null); }} style={{ background: "none", border: "0.5px solid #ddd", borderRadius: 8, padding: "6px 12px", cursor: "pointer", fontSize: 14 }}>{"<"}</button>
        <span style={{ fontWeight: 500, fontSize: 14 }}>{viewDate.toLocaleDateString("en", { month: "long", year: "numeric" })}</span>
        <button onClick={function() { setViewDate(new Date(year, month + 1, 1)); setSelectedISO(null); setSelectedWeek(null); }} style={{ background: "none", border: "0.5px solid #ddd", borderRadius: 8, padding: "6px 12px", cursor: "pointer", fontSize: 14 }}>{">"}</button>
      </div>
      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        {[["daily","Daily"],["weekly","Weekly"]].map(function(item) { return <button key={item[0]} onClick={function() { setCalView(item[0]); setSelectedISO(null); setSelectedWeek(null); }} style={{ flex: 1, padding: "8px 0", borderRadius: 10, border: "0.5px solid #ccc", cursor: "pointer", fontWeight: 500, fontSize: 13, background: calView === item[0] ? "#1a1a1a" : "#fff", color: calView === item[0] ? "#fff" : "#666" }}>{item[1]}</button>; })}
      </div>
      {calView === "daily" && (
        <div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 8 }}>{["M","T","W","T","F","S","S"].map(function(d, i) { return <div key={i} style={{ textAlign: "center", fontSize: 11, color: "#aaa", fontWeight: 500 }}>{d}</div>; })}</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
            {Array.from({ length: firstDay }, function(_, i) { return <div key={"b" + i} />; })}
            {Array.from({ length: daysInMonth }, function(_, i) {
              var day = i + 1; var iso = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
              var isToday = iso === todayISO(), isSelected = iso === selectedISO;
              var hasSession = trainHistory.some(function(s) { return s["Date"] === iso || s.dateISO === iso; });
              var hasBurn = !!burnLogs[iso];
              return <div key={day} onClick={function() { setSelectedISO(isSelected ? null : iso); }} style={{ background: hasBurn ? "#dbeafe" : "#f9f9f7", borderRadius: 8, padding: "5px 3px", minHeight: 44, border: isSelected ? "2px solid #1a1a1a" : isToday ? "2px solid #888" : "0.5px solid #e0e0e0", cursor: "pointer" }}><div style={{ fontSize: 12, fontWeight: isToday ? 700 : 400, textAlign: "center" }}>{day}</div>{hasSession && <div style={{ width: 5, height: 5, borderRadius: "50%", background: "#2d7a4f", margin: "2px auto 0" }} />}</div>;
            })}
          </div>
          {selectedISO && <DayDetail iso={selectedISO} config={config} burnLogs={burnLogs} onSaveBurn={onSaveBurn} trainHistory={trainHistory} correction={correction} />}
          <div style={{ marginTop: 12, display: "flex", gap: 8, flexWrap: "wrap" }}>
            {[["#dbeafe","Burn logged"],["#f9f9f7","No data"]].map(function(item) { return <div key={item[1]} style={{ display: "flex", alignItems: "center", gap: 3, fontSize: 10, color: "#666" }}><div style={{ width: 10, height: 10, borderRadius: 2, background: item[0], border: "0.5px solid #ddd" }} />{item[1]}</div>; })}
            <div style={{ display: "flex", alignItems: "center", gap: 3, fontSize: 10, color: "#666" }}><div style={{ width: 5, height: 5, borderRadius: "50%", background: "#2d7a4f" }} />Session</div>
          </div>
          <div style={{ fontSize: 11, color: "#aaa", marginTop: 8, textAlign: "center" }}>Full energy balance color coding coming with complete sheet integration</div>
        </div>
      )}
      {calView === "weekly" && (
        <div>
          {getWeeksInMonth().map(function(w) {
            var omronData = omronLogs[w.key] || null;
            return <div key={w.key}><div onClick={function() { setSelectedWeek(selectedWeek === w.key ? null : w.key); }} style={{ background: "#fff", border: "0.5px solid #ddd", borderRadius: selectedWeek === w.key ? "10px 10px 0 0" : 10, padding: "12px 14px", marginBottom: selectedWeek === w.key ? 0 : 8, cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center" }}><span style={{ fontSize: 13, fontWeight: 500 }}>{w.label}</span><div style={{ display: "flex", alignItems: "center", gap: 8 }}>{omronData && <span style={{ fontSize: 11, color: "#2d7a4f", fontWeight: 500 }}>{omronData.weight} kg · {omronData.bf}% BF</span>}<span style={{ fontSize: 14, color: "#aaa" }}>{selectedWeek === w.key ? "^" : "v"}</span></div></div>{selectedWeek === w.key && <WeekDetail weekKey={w.key} omronData={omronData} onSaveOmron={onSaveOmron} />}</div>;
          })}
        </div>
      )}
    </div>
  );
}

// ── SETTINGS ──────────────────────────────────────────────────
function SettingsPanel({ config, onSave, onClose, onPatch }) {
  var [configInput, setConfigInput] = useState(""); var [patchInput, setPatchInput] = useState("");
  var [configErr, setConfigErr] = useState(""); var [patchErr, setPatchErr] = useState("");
  var [configSaved, setConfigSaved] = useState(false); var [patchSaved, setPatchSaved] = useState(false);
  return (
    <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.5)", zIndex: 100, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div style={{ background: "#f5f5f3", borderRadius: "16px 16px 0 0", padding: 16, width: "100%", maxWidth: 480, maxHeight: "85vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}><span style={{ fontWeight: 500, fontSize: 16 }}>Settings</span><button onClick={onClose} style={{ background: "none", border: "none", fontSize: 20, cursor: "pointer", color: "#888" }}>×</button></div>
        <Card><CardHdr left="App config (CONFIG)" /><div style={{ padding: 14 }}><div style={{ fontSize: 12, color: "#888", marginBottom: 8 }}>Paste CONFIG JSON to update athlete stats and nutrition targets.</div><textarea style={{ width: "100%", height: 80, padding: 10, border: "0.5px solid #ccc", borderRadius: 8, fontSize: 12, fontFamily: "monospace", resize: "vertical", marginBottom: 8 }} value={configInput} onChange={function(e) { setConfigInput(e.target.value); }} placeholder='{"athlete":{"weight":83.5,...}}' /><ActionBtn onClick={function() { setConfigErr(""); try { onSave(JSON.parse(configInput)); setConfigSaved(true); setTimeout(function() { setConfigSaved(false); }, 2000); } catch(e) { setConfigErr("Invalid JSON."); } }}>{configSaved ? "Saved" : "Save config"}</ActionBtn>{configErr && <div style={{ fontSize: 12, color: "#dc2626", marginTop: 6 }}>{configErr}</div>}</div></Card>
        <Card><CardHdr left="Data patch" /><div style={{ padding: 14 }}><div style={{ fontSize: 12, color: "#888", marginBottom: 8 }}>Backfill meals or log calorie overrides.</div><textarea style={{ width: "100%", height: 80, padding: 10, border: "0.5px solid #ccc", borderRadius: 8, fontSize: 12, fontFamily: "monospace", resize: "vertical", marginBottom: 8 }} value={patchInput} onChange={function(e) { setPatchInput(e.target.value); }} placeholder='{"type":"nutrition_entry","date":"2026-04-01","meal":"Dinner","food":"Pizza","cal":850,"protein":32,"carbs":110,"fat":28}' /><ActionBtn onClick={function() { setPatchErr(""); try { onPatch(JSON.parse(patchInput)); setPatchSaved(true); setTimeout(function() { setPatchSaved(false); setPatchInput(""); }, 2000); } catch(e) { setPatchErr("Invalid JSON."); } }}>{patchSaved ? "Patched" : "Apply patch"}</ActionBtn>{patchErr && <div style={{ fontSize: 12, color: "#dc2626", marginTop: 6 }}>{patchErr}</div>}</div></Card>
        <Card><CardHdr left="Current config" /><div style={{ padding: 14 }}>{[["Weight", config.athlete.weight + " kg"],["SMM", config.athlete.smm + " kg"],["BF%", config.athlete.bf + "%"],["Scan date", config.athlete.scanDate],["Cal training", config.nutrition.caloriesTraining + " kcal"],["Cal rest", config.nutrition.caloriesRest + " kcal"],["Protein", config.nutrition.protein + "g"],["HRmax", config.training.hmaxBpm + " bpm"],["PW correction", (config.training.pixelWatchCorrection * 100) + "%"]].map(function(item) { return <div key={item[0]} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "4px 0", borderBottom: "0.5px solid #f0f0f0" }}><span style={{ color: "#888" }}>{item[0]}</span><span style={{ fontWeight: 500 }}>{item[1]}</span></div>; })}</div></Card>
      </div>
    </div>
  );
}

// ── ROOT ──────────────────────────────────────────────────────
function App() {
  var [tab, setTab] = useState("dashboard");
  var [config, setConfig] = useState(function() { try { var r = localStorage.getItem("hh_config"); return r ? JSON.parse(r) : DEFAULT_CONFIG; } catch(e) { return DEFAULT_CONFIG; } });
  var [todayISO()Logs, setTodayLogs] = useState([]);
  var [burnLogs, setBurnLogs] = useState({});
  var [omronLogs, setOmronLogs] = useState({});
  var [calOverrides, setCalOverrides] = useState({});
  var [weekSessions, setWeekSessions] = useState([]);
  var [weeklyRow, setWeeklyRow] = useState(null);
  var [lastSessionData, setLastSessionData] = useState({});
  var [showSettings, setShowSettings] = useState(false);
  var [loading, setLoading] = useState(true);

  // ── DATE CHANGE DETECTION ─────────────────────────────────
  var loadedDate = useRef(todayISO());
  useEffect(function() {
    var interval = setInterval(function() {
      if (todayISO() !== loadedDate.current) {
        window.location.reload();
      }
    }, 60000);
    return function() { clearInterval(interval); };
  }, []);

  // ── LOAD ON MOUNT ─────────────────────────────────────────
  useEffect(function() {
    async function load() {
      try {
        // Load config from localStorage
        try { var cfg = localStorage.getItem("hh_config"); if (cfg) setConfig(JSON.parse(cfg)); } catch(e) {}
        try { var co = localStorage.getItem("hh_cal_overrides"); if (co) setCalOverrides(JSON.parse(co)); } catch(e) {}

        // Fetch today's data from sheet
        var todayData = await sheetsGet("getToday", { date: todayISO()ISO() });
        if (todayData && todayData.data) {
          // Reconstruct todayLogs from meals
          if (todayData.data.meals && todayData.data.meals.length) {
            var meals = todayData.data.meals.map(function(m, i) {
              return {
                id: i + 1,
                meal: m["Meal"] || "Breakfast",
                food: m["Food"] || "",
                cal: parseFloat(m["Calories"]) || 0,
                protein: parseFloat(m["Protein (g)"]) || 0,
                carbs: parseFloat(m["Carbs (g)"]) || 0,
                fat: parseFloat(m["Fat (g)"]) || 0,
                eatOut: m["Home/Eat-out"] === "Eat-out",
                restaurantType: m["Restaurant Type"] || "",
                description: m["Description"] || ""
              };
            });
            setTodayLogs(meals);
          }
          // Get burn log for today
          if (todayData.data.daily && todayData.data.daily["Calories Burned (raw)"]) {
          setBurnLogs(function(prev) { var n = Object.assign({}, prev); n[todayISO()ISO()] = parseFloat(todayData.data.daily["Calories Burned (raw)"]); return n; });
          }
        }

        // Fetch current week data
        var weekData = await sheetsGet("getWeek", { weekKey: getWeekKey(todayISO()) });
        if (weekData && weekData.data) {
          if (weekData.data.sessions) setWeekSessions(weekData.data.sessions);
          if (weekData.data.weekly) setWeeklyRow(weekData.data.weekly);
          if (weekData.data.omron) {
            var omron = weekData.data.omron;
            setOmronLogs(function(prev) { var n = Object.assign({}, prev); n[wk] = { weight: omron.weight, bf: omron.bf }; return n; });
          }
          // Build lastSessionData from most recent session
          if (weekData.data.sessions && weekData.data.sessions.length) {
            var lastSess = weekData.data.sessions[weekData.data.sessions.length - 1];
            if (lastSess) setLastSessionData({});
          }
        }

        // Fetch burn logs for calendar
        var burnData = await sheetsGet("getBurnLogs", {});
        if (burnData && burnData.data) setBurnLogs(burnData.data);

      } catch(e) {
        console.error("Load error:", e);
      }
      setLoading(false);
    }
    load();
  }, []);

  // ── MEAL ACTIONS ──────────────────────────────────────────
  function handleAddMeal(entry) {
    var newLogs = todayLogs.concat([entry]);
    setTodayLogs(newLogs);
    // Write to sheet
   var isTraining = weekSessions.some(function(s) { return s["Date"] === todayISO()ISO(); });
   var calGoal = calOverrides[todayISO()ISO()] || (isTraining ? config.nutrition.caloriesTraining : config.nutrition.caloriesRest); 
   sheetsWrite("logMeals", {
      date: todayISO(), calGoal: calGoal, proteinGoal: config.nutrition.protein,
      meals: newLogs.map(function(e) { return { time: new Date().toLocaleTimeString("en", { hour: "2-digit", minute: "2-digit" }), meal: e.meal, food: e.food, cal: e.cal, protein: e.protein, carbs: e.carbs, fat: e.fat, eatOut: e.eatOut ? "Eat-out" : "Home", restaurantType: e.restaurantType || "", description: e.description || "" }; })
    }).catch(function() {});
    syncDaily(newLogs, calGoal);
  }

  function handleDeleteMeal(id) {
    var newLogs = todayLogs.filter(function(e) { return e.id !== id; });
    setTodayLogs(newLogs);
    var isTraining = weekSessions.some(function(s) { return s["Date"] === todayISO()ISO(); });
    var calGoal = calOverrides[todayISO()ISO()] || (isTraining ? config.nutrition.caloriesTraining : config.nutrition.caloriesRest);    sheetsWrite("logMeals", {
      date: todayISO(), calGoal: calGoal, proteinGoal: config.nutrition.protein,
      meals: newLogs.map(function(e) { return { time: "", meal: e.meal, food: e.food, cal: e.cal, protein: e.protein, carbs: e.carbs, fat: e.fat, eatOut: e.eatOut ? "Eat-out" : "Home", restaurantType: e.restaurantType || "", description: e.description || "" }; })
    }).catch(function() {});
    syncDaily(newLogs, calGoal);
  }

  function syncDaily(logs, calGoal) {
    var totals = logs.reduce(function(a, e) { return { cal: a.cal + (e.cal||0), protein: a.protein + (e.protein||0), carbs: a.carbs + (e.carbs||0), fat: a.fat + (e.fat||0) }; }, { cal: 0, protein: 0, carbs: 0, fat: 0 });
    var eatOut = logs.filter(function(e) { return e.eatOut; }).length;
    var burn = burnLogs[todayISO()ISO()]; var corrected = burn ? Math.round(burn * config.training.pixelWatchCorrection) : "";
    sheetsWrite("logDaily", { date: todayISO(), cal: totals.cal, protein: totals.protein, carbs: totals.carbs, fat: totals.fat, calGoal: calGoal, calDelta: totals.cal - calGoal, proteinGoal: config.nutrition.protein, proteinDelta: totals.protein - config.nutrition.protein, burned: burn || "", energyBalance: corrected ? totals.cal - corrected : "", eatOutMeals: eatOut }).catch(function() {});
  }

  // ── BURN LOG ──────────────────────────────────────────────
  function handleSaveBurn(iso, value) {
    var updated = Object.assign({}, burnLogs); updated[iso] = value;
    setBurnLogs(updated);
    sheetsWrite("logDaily", { date: iso, burned: value }).catch(function() {});
  }

  // ── OMRON ─────────────────────────────────────────────────
  function handleSaveOmron(weekKey, weight, bf) {
    setOmronLogs(function(prev) { var n = Object.assign({}, prev); n[weekKey] = { weight: weight, bf: bf }; return n; });
    sheetsWrite("logBodyComp", { entryDate: todayISO(), weekNumber: weekKey, weight: weight, bf: bf }).catch(function() {});
  }

  // ── SESSION SAVED ─────────────────────────────────────────
  function handleSessionSaved(rec) {
    setWeekSessions(function(prev) { return prev.concat([{ "Date": rec.date, "Session Title": rec.title, "Difficulty (kg)": rec.difficulty, "Completion (%)": rec.completion, "Actual Duration (min)": rec.duration, dateISO: rec.dateISO }]); });
  }

  // ── CONFIG & PATCH ────────────────────────────────────────
  function handleConfigSave(c) { setConfig(c); localStorage.setItem("hh_config", JSON.stringify(c)); }
  function handlePatch(patch) {
    if (patch.type === "nutrition_entry") {
      var entry = { id: Date.now(), meal: patch.meal, food: patch.food, cal: patch.cal, protein: patch.protein, carbs: patch.carbs, fat: patch.fat, eatOut: patch.eatOut || false, restaurantType: patch.restaurantType || "", description: patch.description || "" };
      if (!patch.date || patch.date === todayISO()) { handleAddMeal(entry); }
      else {
        sheetsWrite("logMeals", { date: patch.date, calGoal: config.nutrition.caloriesRest, proteinGoal: config.nutrition.protein, meals: [{ time: "", meal: entry.meal, food: entry.food, cal: entry.cal, protein: entry.protein, carbs: entry.carbs, fat: entry.fat, eatOut: entry.eatOut ? "Eat-out" : "Home", restaurantType: entry.restaurantType, description: entry.description }] }).catch(function() {});
      }
    } else if (patch.type === "calorie_override") {
      var updated = Object.assign({}, calOverrides); updated[patch.date] = patch.caloriesOverride;
      setCalOverrides(updated); localStorage.setItem("hh_cal_overrides", JSON.stringify(updated));
    }
  }

  var isTrainingDay = weekSessions.some(function(s) { return s["Date"] === todayISO()ISO() || s.dateISO === todayISO()ISO(); });
  var calOverrideToday = calOverrides[todayISO()ISO()] || null;
  var calGoal = calOverrideToday || (isTrainingDay ? config.nutrition.caloriesTraining : config.nutrition.caloriesRest);
  var carbGoal = isTrainingDay ? config.nutrition.carbsTraining : config.nutrition.carbsRest;
  var fatGoal = isTrainingDay ? config.nutrition.fatTraining : config.nutrition.fatRest;

  if (loading) return (
    <div style={{ fontFamily: "system-ui,sans-serif", background: "#f5f5f3", minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
      <div style={{ fontSize: 20, fontWeight: 500, marginBottom: 24 }}>Heavy Hybrid</div>
      <Loader />
      <div style={{ fontSize: 13, color: "#aaa", marginTop: 16 }}>Loading your data...</div>
    </div>
  );

  return (
    <div style={{ fontFamily: "system-ui,sans-serif", background: "#f5f5f3", color: "#1a1a1a", minHeight: "100vh", maxWidth: 480, margin: "0 auto", padding: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div style={{ fontSize: 20, fontWeight: 500 }}>Heavy Hybrid</div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 11, color: "#aaa" }}>{config.athlete.weight} kg · {config.athlete.bf}% BF</span>
          <button style={{ background: "none", border: "0.5px solid #ddd", borderRadius: 8, padding: "6px 10px", cursor: "pointer", fontSize: 14, color: "#888" }} onClick={function() { setShowSettings(true); }}>settings</button>
        </div>
      </div>
      <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
        {[["dashboard","Dashboard"],["nutrition","Nutrition"],["training","Training"],["calendar","Calendar"]].map(function(item) { return <button key={item[0]} onClick={function() { setTab(item[0]); }} style={{ flex: 1, padding: "9px 0", borderRadius: 20, border: "0.5px solid " + (tab === item[0] ? "#1a1a1a" : "#ddd"), cursor: "pointer", fontWeight: 500, fontSize: 13, background: tab === item[0] ? "#1a1a1a" : "#fff", color: tab === item[0] ? "#fff" : "#888" }}>{item[1]}</button>; })}
      </div>
      {tab === "dashboard" && <Dashboard config={config} todayLogs={todayLogs} calGoal={calGoal} carbGoal={carbGoal} fatGoal={fatGoal} isTrainingDay={isTrainingDay} weekSessions={weekSessions} burnLogs={burnLogs} weeklyRow={weeklyRow} onTabChange={setTab} />}
      {tab === "nutrition" && <NutritionTab config={config} todayLogs={todayLogs} onAddMeal={handleAddMeal} onDeleteMeal={handleDeleteMeal} isTrainingDay={isTrainingDay} calOverride={calOverrideToday} />}
      {tab === "training" && <TrainingTab config={config} onSessionSaved={handleSessionSaved} lastSessionData={lastSessionData} />}
      {tab === "calendar" && <CalendarTab config={config} burnLogs={burnLogs} onSaveBurn={handleSaveBurn} trainHistory={weekSessions} omronLogs={omronLogs} onSaveOmron={handleSaveOmron} />}
      {showSettings && <SettingsPanel config={config} onSave={handleConfigSave} onClose={function() { setShowSettings(false); }} onPatch={handlePatch} />}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
